const EMPTY_DEBT = { total: "", targetDate: "", note: "", payments: [] };

function DebtTracker() {
  const [debt, setDebt] = useState(EMPTY_DEBT);
  const [loaded, setLoaded] = useState(false);
  const [pay, setPay] = useState({ amount: "", note: "" });
  const [editing, setEditing] = useState(true);

  useEffect(() => {
    (async () => {
      let next = null;
      const d = await storeGet("debt");
      if (d) next = { ...EMPTY_DEBT, ...d };
      else {
        const legacy = await storeGet("finance");
        if (legacy?.debt) next = { ...EMPTY_DEBT, total: String(parseMoney(legacy.debt) || ""), note: legacy.notes || "" };
      }
      if (next) setDebt(next);
      setEditing(parseMoney(next?.total) === 0);
      setLoaded(true);
    })();
  }, []);
  useEffect(() => { if (loaded) storeSetDebounced("debt", debt); }, [debt, loaded]);

  const total = parseMoney(debt.total);
  const paid = debt.payments.reduce((a, p) => a + parseMoney(p.amount), 0);
  const remaining = Math.max(0, total - paid);
  const pct = total > 0 ? Math.min(1, paid / total) : 0;
  const cleared = total > 0 && remaining === 0;

  const daysLeft = debt.targetDate ? daysBetween(new Date(), fromKey(debt.targetDate)) : null;
  const monthsLeft = daysLeft != null ? Math.max(0, daysLeft / 30.44) : null;
  const perMonth = monthsLeft && monthsLeft > 0 ? remaining / monthsLeft : null;

  const addPayment = () => {
    if (!parseMoney(pay.amount)) return;
    setDebt({ ...debt, payments: [{ id: uid(), date: toKey(new Date()), amount: parseMoney(pay.amount), note: pay.note }, ...debt.payments] });
    setPay({ amount: "", note: "" });
  };
  const removePayment = (id) => setDebt({ ...debt, payments: debt.payments.filter((p) => p.id !== id) });

  if (!loaded) return <Card><div style={{ color: COLORS.muted, fontFamily: SANS, fontSize: 13 }}>Loading</div></Card>;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone={cleared ? "gold" : "sky"} glow={cleared ? "none" : "sky"}>
        <SectionLabel icon={Wallet} tone={cleared ? "gold" : "sky"} right={
          <button onClick={() => setEditing((e) => !e)} style={{
            background: "none", border: "none", color: COLORS.muted, fontFamily: SANS, fontSize: 11.5, cursor: "pointer",
          }}>{editing ? "Done" : "Edit"}</button>
        }>Debt payoff</SectionLabel>

        {editing ? (
          <div>
            <Field label="Total owed">
              <TextInput value={debt.total} onChange={(v) => setDebt({ ...debt, total: v })} placeholder="2000000" inputMode="decimal" />
            </Field>
            <Field label="Clear it by" hint="Sets the monthly pace you need.">
              <DateInput value={debt.targetDate} onChange={(v) => setDebt({ ...debt, targetDate: v })} />
            </Field>
            <Field label="Notes">
              <TextArea value={debt.note} onChange={(v) => setDebt({ ...debt, note: v })} rows={2} placeholder="Who it is owed to, repayment plan, zakat targets" />
            </Field>
            <button onClick={() => setEditing(false)} disabled={total <= 0}
              style={{ ...addBtn, width: "100%", opacity: total > 0 ? 1 : 0.45, cursor: total > 0 ? "pointer" : "not-allowed" }}>
              {total > 0 ? "Save" : "Enter a total to continue"}
            </button>
          </div>
        ) : (
          <div>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 10, marginBottom: 10 }}>
              <div className="tnum" style={{ fontFamily: SERIF, fontSize: 32, color: cleared ? COLORS.gold : COLORS.text, lineHeight: 1.1 }}>
                {fmtNaira(remaining)}
              </div>
              <div className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.muted, textAlign: "right" }}>
                {Math.round(pct * 100)}% CLEARED
              </div>
            </div>
            <ProgressBar value={pct} tone={cleared ? "gold" : "success"} height={10} showSheen={cleared} />
            <div className="tnum" style={{ display: "flex", justifyContent: "space-between", fontFamily: SANS, fontSize: 11.5, color: COLORS.muted, marginTop: 7 }}>
              <span>{fmtNaira(paid)} paid</span>
              <span>of {fmtNaira(total)}</span>
            </div>

            {cleared ? (
              <div style={{
                marginTop: 12, padding: "11px 13px", borderRadius: 10, background: "rgba(227,179,65,0.10)",
                border: "1px solid rgba(227,179,65,0.35)", fontFamily: SERIF, fontSize: 14, color: COLORS.gold, fontStyle: "italic",
              }}>Cleared. Every debt has an end.</div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 12 }}>
                <StatTile label="Target date" size={16}
                  value={debt.targetDate ? shortDate(fromKey(debt.targetDate)) : "Not set"}
                  sub={daysLeft == null ? "add one to set a pace" : daysLeft < 0 ? `${Math.abs(daysLeft)} days overdue` : `${daysLeft} days left`}
                  tone={daysLeft != null && daysLeft < 0 ? "danger" : "text"} />
                <StatTile label="Needed / month" size={16}
                  value={perMonth ? fmtNaira(perMonth, true) : "\u2014"}
                  sub={debt.payments.length ? `${debt.payments.length} payments made` : "no payments yet"}
                  tone="sky" />
              </div>
            )}
            {debt.note && (
              <div style={{ fontFamily: SANS, fontSize: 12, color: COLORS.muted, marginTop: 12, whiteSpace: "pre-wrap", lineHeight: 1.55 }}>{debt.note}</div>
            )}
          </div>
        )}
      </Card>

      {total > 0 && !editing && (
        <Card>
          <SectionLabel icon={Coins}>Record a payment</SectionLabel>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <TextInput value={pay.amount} onChange={(v) => setPay({ ...pay, amount: v })} placeholder="Amount" inputMode="decimal" />
            <TextInput value={pay.note} onChange={(v) => setPay({ ...pay, note: v })} placeholder="Note" />
          </div>
          <button onClick={addPayment} style={{ ...addBtn, width: "100%" }}><Plus size={14} /> Add payment</button>

          {debt.payments.length > 0 && (
            <div style={{ marginTop: 14, borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 12 }}>
              {debt.payments.map((p) => (
                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid rgba(28,48,73,0.35)` }}>
                  <span className="tnum" style={{ fontFamily: SERIF, fontSize: 15, color: COLORS.success, minWidth: 84 }}>{fmtNaira(p.amount)}</span>
                  <span style={{ flex: 1, fontFamily: SANS, fontSize: 12, color: COLORS.muted, minWidth: 0 }}>{p.note || "Payment"}</span>
                  <span className="tnum" style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.faint }}>{p.date}</span>
                  <IconX onClick={() => removePayment(p.id)} />
                </div>
              ))}
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

function Dreams() {
  const [dreams, setDreams] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState({ text: "", deadline: "" });

  useEffect(() => { (async () => { const d = await storeGet("dreams"); if (d) setDreams(d); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) storeSetDebounced("dreams", dreams); }, [dreams, loaded]);

  const add = () => {
    if (!form.text.trim()) return;
    setDreams([...dreams, { id: uid(), text: form.text, deadline: form.deadline, done: false, createdAt: toKey(new Date()) }]);
    setForm({ text: "", deadline: "" });
  };
  const toggle = (id) => setDreams(dreams.map((d) => d.id === id ? { ...d, done: !d.done, doneAt: !d.done ? toKey(new Date()) : null } : d));
  const remove = (id) => setDreams(dreams.filter((d) => d.id !== id));
  const setDeadline = (id, v) => setDreams(dreams.map((d) => d.id === id ? { ...d, deadline: v } : d));

  const sorted = [...dreams].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (!a.deadline && !b.deadline) return 0;
    if (!a.deadline) return 1;
    if (!b.deadline) return -1;
    return a.deadline < b.deadline ? -1 : 1;
  });
  const achieved = dreams.filter((d) => d.done).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone="violet" glow="violet">
        <SectionLabel icon={Sparkles} tone="violet" right={
          dreams.length > 0 ? <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.teal }}>{achieved}/{dreams.length}</span> : null
        }>Dreams with dates</SectionLabel>
        {dreams.length > 0 && <div style={{ marginBottom: 14 }}><ProgressBar value={achieved / dreams.length} tone="violet" /></div>}

        {sorted.map((d) => {
          const left = d.deadline ? daysBetween(new Date(), fromKey(d.deadline)) : null;
          const overdue = left != null && left < 0 && !d.done;
          const soon = left != null && left >= 0 && left <= 30 && !d.done;
          return (
            <div key={d.id} style={{
              border: `1px solid ${d.done ? "rgba(167,139,250,0.45)" : overdue ? "rgba(225,91,91,0.4)" : COLORS.border}`,
              background: d.done ? "rgba(167,139,250,0.08)" : "rgba(4,7,14,0.32)",
              borderRadius: 12, padding: "11px 12px", marginBottom: 9,
            }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                <button onClick={() => toggle(d.id)} aria-label="Toggle" style={{
                  width: 19, height: 19, borderRadius: 6, flexShrink: 0, marginTop: 1, cursor: "pointer",
                  border: `1.5px solid ${d.done ? COLORS.teal : COLORS.faint}`,
                  background: d.done ? COLORS.teal : "transparent",
                  display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.ink, padding: 0,
                }}>{d.done && <Check size={13} strokeWidth={3.4} />}</button>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontFamily: SANS, fontSize: 14, color: d.done ? COLORS.muted : COLORS.text,
                    textDecoration: d.done ? "line-through" : "none",
                  }}>{d.text}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 7, flexWrap: "wrap" }}>
                    <div style={{ width: 140 }}>
                      <DateInput value={d.deadline} onChange={(v) => setDeadline(d.id, v)} />
                    </div>
                    {d.done ? (
                      <span style={{ fontFamily: MONO, fontSize: 10, color: COLORS.teal, letterSpacing: 0.8 }}>ACHIEVED</span>
                    ) : left != null ? (
                      <span className="tnum" style={{
                        fontFamily: MONO, fontSize: 10, letterSpacing: 0.8,
                        color: overdue ? COLORS.danger : soon ? COLORS.gold : COLORS.muted,
                      }}>{overdue ? `${Math.abs(left)}D OVERDUE` : `${left}D LEFT`}</span>
                    ) : (
                      <span style={{ fontFamily: MONO, fontSize: 10, color: COLORS.faint, letterSpacing: 0.8 }}>NO DATE</span>
                    )}
                  </div>
                </div>
                <IconX onClick={() => remove(d.id)} />
              </div>
            </div>
          );
        })}

        {dreams.length === 0 && <EmptyState icon={Target} title="No dreams written down yet." action="A dream with a date is a goal." />}

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 12 }}>
          <TextInput value={form.text} onChange={(v) => setForm({ ...form, text: v })} placeholder="Car, house, wife and kids, hajj" />
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><DateInput value={form.deadline} onChange={(v) => setForm({ ...form, deadline: v })} /></div>
            <button onClick={add} style={{ ...addBtn, background: COLORS.teal }}><Plus size={14} /> Add</button>
          </div>
        </div>
      </Card>
    </div>
  );
}

Everything else in this app is retrospective. This is the part that runs
before the slip: log it, wait it out, do something else with your hands.

function HoldScreen({ onClose, onLog, redirects, holdMinutes = 10 }) {
  const [phase, setPhase] = useState("hold");
  const [left, setLeft] = useState(holdMinutes * 60);
  const [trigger, setTrigger] = useState("");
  const [note, setNote] = useState("");
  const [ticked, setTicked] = useState({});
  const startedAt = useRef(Date.now());

  useEffect(() => {
    const t = setInterval(() => setLeft((v) => Math.max(0, v - 1)), 1000);
    return () => clearInterval(t);
  }, []);

  const total = holdMinutes * 60;
  const pct = 1 - left / total;
  const mm = String(Math.floor(left / 60)).padStart(2, "0");
  const ss = String(left % 60).padStart(2, "0");

  const finish = (outcome) => {
    const secs = Math.round((Date.now() - startedAt.current) / 1000);
    onLog({ outcome, trigger, note, seconds: secs, used: Object.keys(ticked).filter((k) => ticked[k]) });
    setPhase(outcome === "held" ? "held" : "slipped");
  };

  const r = 74, c = 2 * Math.PI * r;

  if (phase !== "hold") {
    const held = phase === "held";
    return (
      <div style={overlayStyle}>
        <div className="rise" style={{ textAlign: "center", maxWidth: 320 }}>
          <div className="glow-halo" style={{
            width: 74, height: 74, borderRadius: "50%", margin: "0 auto 18px",
            display: "flex", alignItems: "center", justifyContent: "center",
            background: `radial-gradient(circle, ${held ? "rgba(74,222,158,0.18)" : "rgba(227,179,65,0.16)"}, transparent 70%)`,
            border: `1px solid ${held ? "rgba(74,222,158,0.4)" : "rgba(227,179,65,0.4)"}`,
          }}>
            {held ? <Check size={30} color={COLORS.success} strokeWidth={2.4} /> : <Moon size={28} color={COLORS.gold} strokeWidth={1.8} />}
          </div>
          <div style={{ fontFamily: SERIF, fontSize: 23, color: COLORS.text, lineHeight: 1.35 }}>
            {held ? "It passed." : "Logged. Not judged."}
          </div>
          <div style={{ fontFamily: SANS, fontSize: 13, color: COLORS.muted, marginTop: 12, lineHeight: 1.65 }}>
            {held
              ? "That is the whole battle and you just won it. It is recorded, and it will show up in your pattern map."
              : "Write down what set it off while it is fresh. The pattern is the way out, and you cannot map what you hide."}
          </div>
          <button onClick={onClose} style={{ ...addBtn, marginTop: 22, width: "100%" }}>Close</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ ...overlayStyle, alignItems: "flex-start", overflowY: "auto", paddingTop: 26 }}>
      <div className="scroll-thin" style={{ width: "100%", maxWidth: 400, margin: "0 auto", paddingBottom: 40 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <span style={{ fontFamily: MONO, fontSize: 10.5, letterSpacing: 1.6, textTransform: "uppercase", color: COLORS.sky }}>Holding</span>
          <button onClick={onClose} aria-label="Close" style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", padding: 4 }}>
            <X size={18} />
          </button>
        </div>

        <div style={{ position: "relative", width: 176, height: 176, margin: "0 auto 6px" }}>
          <div className="glow-halo" style={{
            position: "absolute", inset: -8, borderRadius: "50%",
            background: `radial-gradient(circle, rgba(56,189,248,${0.10 + pct * 0.22}), transparent 68%)`, filter: "blur(9px)",
          }} />
          <svg width={176} height={176} style={{ position: "relative", display: "block" }}>
            <circle cx={88} cy={88} r={r} fill="none" stroke="rgba(28,48,73,0.9)" strokeWidth={7} />
            <circle cx={88} cy={88} r={r} fill="none" stroke={COLORS.sky} strokeWidth={7} strokeLinecap="round"
              strokeDasharray={`${c * pct} ${c - c * pct}`} transform="rotate(-90 88 88)"
              style={{ filter: "drop-shadow(0 0 8px rgba(56,189,248,0.7))", transition: "stroke-dasharray 1s linear" }} />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
            <div className="tnum glow-text-sky" style={{ fontFamily: SERIF, fontSize: 38, color: COLORS.sky, lineHeight: 1.1 }}>{mm}:{ss}</div>
            <div style={{ fontFamily: MONO, fontSize: 9, color: COLORS.muted, letterSpacing: 1.4 }}>RIDE IT OUT</div>
          </div>
        </div>

        <div style={{
          fontFamily: SERIF, fontSize: 15, fontStyle: "italic", color: COLORS.text,
          textAlign: "center", lineHeight: 1.6, margin: "10px 0 20px", padding: "0 8px",
        }}>
          "Seek help through patience and prayer." (2:153)
        </div>

        <Card style={{ marginBottom: 12 }}>
          <SectionLabel icon={Target}>Do one of these now</SectionLabel>
          {(redirects && redirects.length ? redirects : DEFAULT_REDIRECTS).map((rr, i) => (
            <Toggle key={i} checked={!!ticked[rr]} onChange={(v) => setTicked({ ...ticked, [rr]: v })} label={rr} />
          ))}
        </Card>

        <Card style={{ marginBottom: 12 }}>
          <SectionLabel icon={Flame} tone="gold">What set this off</SectionLabel>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 10 }}>
            {URGE_TRIGGERS.map((t) => (
              <PillButton key={t} active={trigger === t} onClick={() => setTrigger(trigger === t ? "" : t)} tone="gold">{t}</PillButton>
            ))}
          </div>
          <TextArea value={note} onChange={setNote} rows={2} placeholder="Anything else worth remembering about right now" />
        </Card>

        <div style={{ display: "flex", gap: 9 }}>
          <button onClick={() => finish("held")} style={{ ...addBtn, flex: 1, background: COLORS.success }}>
            <Check size={14} /> It passed
          </button>
          <button onClick={() => finish("slipped")} style={{ ...ghostBtn, flex: 1, color: COLORS.muted }}>
            I slipped
          </button>
        </div>
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, textAlign: "center", marginTop: 12, lineHeight: 1.55 }}>
          Either button logs it. Both are useful data. Only one of them is a lie.
        </div>
      </div>
    </div>
  );
}

/* ---------- TRIGGER MAP ---------- */
function TriggerMap({ events }) {
  const list = events || [];
  if (list.length < 3) {
    return (
      <Card>
        <SectionLabel icon={Flame} tone="gold">Trigger map</SectionLabel>
        <EmptyState icon={Flame} title={`${list.length} of 3 events logged.`}
          action="Use Hold when an urge starts. The map opens once there is enough to be honest about." />
      </Card>
    );
  }

  const byBucket = Array(6).fill(0), byDow = Array(7).fill(0);
  const triggers = {};
  let held = 0;
  list.forEach((e) => {
    if (e.hour != null) byBucket[bucketOf(e.hour)] += 1;
    if (e.dow != null) byDow[e.dow] += 1;
    if (e.trigger) triggers[e.trigger] = (triggers[e.trigger] || 0) + 1;
    if (e.outcome === "held") held += 1;
  });
  const maxB = Math.max(...byBucket, 1), maxD = Math.max(...byDow, 1);
  const topTriggers = Object.entries(triggers).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const holdRate = Math.round((held / list.length) * 100);
  const dayLetters = ["S", "M", "T", "W", "T", "F", "S"];

  return (
    <Card tone="gold">
      <SectionLabel icon={Flame} tone="gold" right={
        <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.muted }}>{list.length} events</span>
      }>Trigger map</SectionLabel>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 16 }}>
        <StatTile label="Urges held" value={`${holdRate}%`} tone={holdRate >= 50 ? "success" : "gold"} sub={`${held} of ${list.length}`} />
        <StatTile label="Worst window" value={HOUR_BUCKETS[byBucket.indexOf(maxB)].label} tone="gold" size={17}
          sub={`${maxB} events`} />
      </div>

      <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
        By time of day
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 74, marginBottom: 6 }}>
        {byBucket.map((v, i) => (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }}>
            <span className="tnum" style={{ fontFamily: MONO, fontSize: 9, color: v ? COLORS.gold : COLORS.faint, textAlign: "center", marginBottom: 3 }}>{v || ""}</span>
            <div style={{
              height: `${Math.max(4, (v / maxB) * 100)}%`, borderRadius: "6px 6px 3px 3px",
              background: v ? `linear-gradient(180deg, ${COLORS.gold}, rgba(227,179,65,0.3))` : "rgba(28,48,73,0.6)",
              boxShadow: v === maxB && v > 0 ? "0 0 12px rgba(227,179,65,0.5)" : "none",
            }} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: 18 }}>
        {HOUR_BUCKETS.map((b) => (
          <div key={b.label} style={{ flex: 1, textAlign: "center", fontFamily: MONO, fontSize: 8, color: COLORS.faint }}>{b.label}</div>
        ))}
      </div>

      <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
        By day of week
      </div>
      <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 58, marginBottom: 6 }}>
        {byDow.map((v, i) => (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-end", height: "100%" }}>
            <div style={{
              height: `${Math.max(4, (v / maxD) * 100)}%`, borderRadius: "6px 6px 3px 3px",
              background: v ? `linear-gradient(180deg, ${COLORS.sky}, rgba(56,189,248,0.25))` : "rgba(28,48,73,0.6)",
              boxShadow: v === maxD && v > 0 ? "0 0 12px rgba(56,189,248,0.45)" : "none",
            }} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 6, marginBottom: topTriggers.length ? 18 : 0 }}>
        {dayLetters.map((d, i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", fontFamily: MONO, fontSize: 9, color: COLORS.faint }}>{d}</div>
        ))}
      </div>

      {topTriggers.length > 0 && (
        <>
          <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
            Named triggers
          </div>
          {topTriggers.map(([name, count]) => (
            <div key={name} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
              <span style={{ fontFamily: SANS, fontSize: 12, color: COLORS.text, width: 108, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{name}</span>
              <div style={{ flex: 1 }}><ProgressBar value={count / topTriggers[0][1]} height={6} tone="gold" /></div>
              <span className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.muted, width: 18, textAlign: "right" }}>{count}</span>
            </div>
          ))}
        </>
      )}
    </Card>
  );
}

/* ---------- BACKFILL DATE STRIP ---------- */
function DateStrip({ activeKey, setActiveKey, history }) {
  const today = new Date();
  const anchor = fromKey(activeKey);
  const days = [];
  for (let i = 6; i >= 0; i--) days.push(addDays(anchor, -i));
  const isToday = activeKey === toKey(today);
  const canForward = anchor < new Date(today.getFullYear(), today.getMonth(), today.getDate());

  return (
    <Card style={{ padding: "12px 13px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.3, textTransform: "uppercase", color: isToday ? COLORS.muted : COLORS.gold }}>
          {isToday ? "Logging today" : `Backfilling ${anchor.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}`}
        </span>
        {!isToday && (
          <button onClick={() => setActiveKey(toKey(today))} style={{
            background: "none", border: "none", color: COLORS.sky, fontFamily: SANS, fontSize: 11.5, cursor: "pointer", padding: 0,
          }}>Back to today</button>
        )}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
        <button onClick={() => setActiveKey(toKey(addDays(anchor, -7)))} aria-label="Earlier week"
          style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", padding: 3, display: "flex" }}>
          <ChevronLeft size={15} />
        </button>
        {days.map((d) => {
          const k = toKey(d);
          const on = k === activeKey;
          const future = d > today;
          const sm = history[k];
          const logged = sm && (sm.p > 0 || sm.clean != null || sm.q || sm.f || sm.az);
          return (
            <button key={k} disabled={future} onClick={() => setActiveKey(k)} style={{
              flex: 1, minWidth: 0, padding: "7px 2px", borderRadius: 9, cursor: future ? "not-allowed" : "pointer",
              background: on ? "rgba(56,189,248,0.14)" : "transparent",
              border: `1px solid ${on ? COLORS.sky : "transparent"}`,
              color: future ? COLORS.faint : on ? COLORS.sky : COLORS.muted,
              opacity: future ? 0.35 : 1,
            }}>
              <div style={{ fontFamily: MONO, fontSize: 8.5, letterSpacing: 0.5 }}>{"SMTWTFS"[d.getDay()]}</div>
              <div className="tnum" style={{ fontFamily: SERIF, fontSize: 15, marginTop: 2 }}>{d.getDate()}</div>
              <div style={{
                width: 4, height: 4, borderRadius: "50%", margin: "3px auto 0",
                background: logged ? (sm.clean === false ? COLORS.danger : COLORS.success) : "transparent",
              }} />
            </button>
          );
        })}
        <button onClick={() => canForward && setActiveKey(toKey(addDays(anchor, 7) > today ? today : addDays(anchor, 7)))}
          disabled={!canForward} aria-label="Later week"
          style={{ background: "none", border: "none", color: canForward ? COLORS.muted : COLORS.faint, cursor: canForward ? "pointer" : "not-allowed", padding: 3, display: "flex" }}>
          <ChevronRight size={15} />
        </button>
      </div>
    </Card>
  );
}

/* ============================== STREAK HEATMAP ============================== */

const HEAT_MODES = [
  { id: "overall", label: "Overall" },
  { id: "prayers", label: "Prayers" },
  { id: "clean", label: "Clean" },
];

function heatCell(mode, s) {
  if (!s) return { bg: "rgba(4,7,14,0.5)", border: COLORS.border, glow: false, mark: null };
  if (mode === "clean") {
    if (s.clean === true) return { bg: "rgba(74,222,158,0.30)", border: "rgba(74,222,158,0.65)", glow: true, mark: null };
    if (s.clean === false) return { bg: "rgba(225,91,91,0.28)", border: "rgba(225,91,91,0.6)", glow: false, mark: "slip" };
    return { bg: "rgba(4,7,14,0.5)", border: COLORS.border, glow: false, mark: null };
  }
  const v = mode === "prayers" ? s.p / 5 : dayScore(s);
  if (v <= 0.02) return { bg: "rgba(4,7,14,0.5)", border: COLORS.border, glow: false, mark: null };
  return {
    bg: `rgba(56,189,248,${0.10 + v * 0.46})`,
    border: `rgba(56,189,248,${0.24 + v * 0.5})`,
    glow: v >= 0.85,
    mark: mode === "overall" && s.clean === false ? "slip" : null,
  };
}

function StreakHeatmap({ history }) {
  const today = new Date();
  const [cursor, setCursor] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [mode, setMode] = useState("overall");

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const lead = first.getDay();
  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));

  const monthKeys = Array.from({ length: daysInMonth }, (_, i) => toKey(new Date(year, month, i + 1)));
  const monthRows = monthKeys.map((k) => history[k]).filter(Boolean);
  const cleanDays = monthRows.filter((s) => s.clean === true).length;
  const slips = monthRows.filter((s) => s.clean === false).length;
  const perfect = monthRows.filter((s) => s.p === 5).length;
  const avgP = monthRows.length ? monthRows.reduce((a, s) => a + s.p, 0) / monthRows.length : 0;

  let run = 0, bestRun = 0;
  for (const k of monthKeys) {
    const s = history[k];
    if (s?.clean === true) { run += 1; bestRun = Math.max(bestRun, run); }
    else if (s?.clean === false) run = 0;
  }

  return (
    <Card>
      <SectionLabel icon={Flame} right={
        <div style={{ display: "flex", alignItems: "center", gap: 2 }}>
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} aria-label="Previous month"
            style={{ background: "none", border: "none", color: COLORS.muted, cursor: "pointer", padding: 4, display: "flex" }}>
            <ChevronLeft size={16} />
          </button>
          <span className="tnum" style={{ fontFamily: MONO, fontSize: 10.5, color: COLORS.text, minWidth: 74, textAlign: "center", letterSpacing: 0.8 }}>
            {cursor.toLocaleDateString(undefined, { month: "short", year: "numeric" }).toUpperCase()}
          </span>
          <button onClick={() => !isCurrentMonth && setCursor(new Date(year, month + 1, 1))} aria-label="Next month"
            disabled={isCurrentMonth}
            style={{ background: "none", border: "none", color: isCurrentMonth ? COLORS.faint : COLORS.muted, cursor: isCurrentMonth ? "not-allowed" : "pointer", padding: 4, display: "flex" }}>
            <ChevronRight size={16} />
          </button>
        </div>
      }>Consistency</SectionLabel>

      <div className="no-scrollbar" style={{ display: "flex", gap: 7, marginBottom: 12, overflowX: "auto" }}>
        {HEAT_MODES.map((m) => (
          <PillButton key={m.id} active={mode === m.id} onClick={() => setMode(m.id)}>{m.label}</PillButton>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 5, marginBottom: 6 }}>
        {["S", "M", "T", "W", "T", "F", "S"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontFamily: MONO, fontSize: 9, color: COLORS.faint, letterSpacing: 0.6 }}>{d}</div>
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 5 }}>
        {cells.map((d, i) => {
          if (!d) return <div key={`e${i}`} />;
          const k = toKey(d);
          const s = history[k];
          const c = heatCell(mode, s);
          const isToday = k === toKey(today);
          const future = d > today;
          const title = s
            ? `${k}: ${s.p}/5 prayers${s.clean === true ? ", clean" : s.clean === false ? ", relapse" : ""}${s.q ? ", Qur'an" : ""}${s.f ? ", fasted" : ""}`
            : `${k}: nothing logged`;
          return (
            <div key={k} title={title} style={{
              aspectRatio: "1 / 1", borderRadius: 8, position: "relative",
              background: future ? "transparent" : c.bg,
              border: `1px solid ${isToday ? COLORS.sky : future ? "rgba(28,48,73,0.35)" : c.border}`,
              boxShadow: c.glow && !future ? "0 0 10px rgba(56,189,248,0.30)" : isToday ? `0 0 10px ${COLORS.sky}66` : "none",
              display: "flex", alignItems: "center", justifyContent: "center",
              opacity: future ? 0.35 : 1,
            }}>
              <span className="tnum" style={{
                fontFamily: MONO, fontSize: 9,
                color: c.mark === "slip" ? COLORS.danger : s ? "rgba(234,243,250,0.75)" : COLORS.faint,
              }}>{d.getDate()}</span>
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ fontFamily: MONO, fontSize: 9, color: COLORS.faint, letterSpacing: 0.8 }}>LESS</span>
          {[0.02, 0.3, 0.55, 0.8, 1].map((v, i) => (
            <span key={i} style={{
              width: 12, height: 12, borderRadius: 4,
              background: mode === "clean"
                ? (i === 0 ? "rgba(4,7,14,0.5)" : `rgba(74,222,158,${0.08 + v * 0.28})`)
                : (i === 0 ? "rgba(4,7,14,0.5)" : `rgba(56,189,248,${0.10 + v * 0.46})`),
              border: `1px solid ${COLORS.border}`,
            }} />
          ))}
          <span style={{ fontFamily: MONO, fontSize: 9, color: COLORS.faint, letterSpacing: 0.8 }}>MORE</span>
        </div>
        {slips > 0 && (
          <span className="tnum" style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.danger, letterSpacing: 0.8 }}>
            {slips} SLIP{slips === 1 ? "" : "S"}
          </span>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 14 }}>
        <StatTile label="Clean days" value={cleanDays} size={19} tone={cleanDays > 0 ? "success" : "text"} sub="this month" />
        <StatTile label="Best run" value={`${bestRun}d`} size={19} tone="sky" sub="in this month" />
        <StatTile label="Full salah" value={perfect} size={19} tone="violet" sub={`avg ${avgP.toFixed(1)}/5`} />
      </div>
    </Card>
  );
}

function Accountability({ dayData, updateDay, points, history, events, redirects, setRedirects, onHold, activeKey, setActiveKey, logEvent }) {
  const [sub, setSub] = useState("today");
  const addiction = dayData?.addiction || { mast: false, mastWhy: "", porn: false, pornWhy: "" };
  const isToday = activeKey === toKey(new Date());

  const setA = (patch) => {
    const next = { ...addiction, ...patch };
    const turningOn = (patch.mast === true && !addiction.mast) || (patch.porn === true && !addiction.porn);
    if (turningOn && isToday) {
      const already = (events || []).some((e) => e.dateKey === activeKey && e.outcome === "slipped");
      if (!already) logEvent({ outcome: "slipped", trigger: "", note: "Logged in evening review", seconds: 0 });
    }
    updateDay({ addiction: next });
  };

  const logged = !!dayData?.addiction;
  const cleanToday = logged && !addiction.mast && !addiction.porn && !addiction.slip;

  const nextMilestone = points.streak < 7 ? 7 : points.streak < 30 ? 30 : points.streak < 90 ? 90 : points.streak < 180 ? 180 : 365;
  const prevMilestone = nextMilestone === 7 ? 0 : nextMilestone === 30 ? 7 : nextMilestone === 90 ? 30 : nextMilestone === 180 ? 90 : 180;
  const milestonePct = (points.streak - prevMilestone) / (nextMilestone - prevMilestone);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div className="no-scrollbar" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2 }}>
        <PillButton active={sub === "today"} onClick={() => setSub("today")}>Review</PillButton>
        <PillButton active={sub === "patterns"} onClick={() => setSub("patterns")} tone="gold">Patterns</PillButton>
        <PillButton active={sub === "plan"} onClick={() => setSub("plan")}>Plan</PillButton>
      </div>

      {sub === "today" && (
        <>
          <Card glow="sky" tone="sky" style={{ textAlign: "center", paddingTop: 20, paddingBottom: 18 }}>
            <SectionLabel icon={ShieldCheck}>Points</SectionLabel>
            <div className="glow-text-sky tnum" style={{ fontFamily: SERIF, fontSize: 42, color: COLORS.sky, lineHeight: 1.05 }}>{points.total}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 }}>
              <StatTile label="Current streak" value={`${points.streak}d`} tone={points.streak > 0 ? "success" : "text"}
                sub={cleanToday ? "today counted" : logged ? "today logged" : "today not logged"} />
              <StatTile label="Best ever" value={`${points.bestStreak}d`} tone="gold" sub="personal record" />
            </div>
            <div style={{ marginTop: 14, textAlign: "left" }}>
              <div className="tnum" style={{ display: "flex", justifyContent: "space-between", fontFamily: MONO, fontSize: 9.5, color: COLORS.muted, letterSpacing: 0.9, marginBottom: 6 }}>
                <span>NEXT MILESTONE</span><span>{points.streak}/{nextMilestone} DAYS</span>
              </div>
              <ProgressBar value={Math.max(0, Math.min(1, milestonePct))} tone="success" />
            </div>
          </Card>

          <button onClick={onHold} className="glow-btn" style={{
            ...addBtn, width: "100%", padding: "16px", fontSize: 14.5,
            background: `linear-gradient(120deg, ${COLORS.sky}, #6BD3FF)`,
          }}>
            <ShieldCheck size={17} /> I am feeling the urge right now
          </button>

          <DateStrip activeKey={activeKey} setActiveKey={setActiveKey} history={history} />

          <Card tone={logged ? (cleanToday ? "sky" : undefined) : "gold"}>
            <SectionLabel icon={Moon}>
              {isToday ? "Evening review, be honest with yourself" : `Review for ${fromKey(activeKey).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`}
            </SectionLabel>
            {addiction.slip && (
              <div style={{
                marginBottom: 10, padding: "10px 12px", borderRadius: 10,
                background: "rgba(227,179,65,0.08)", border: "1px solid rgba(227,179,65,0.3)",
                display: "flex", alignItems: "center", gap: 10,
              }}>
                <span style={{ flex: 1, fontFamily: SANS, fontSize: 12, color: COLORS.gold, lineHeight: 1.5 }}>
                  A slip was logged from Hold. Tick what it was below, or clear it if you pressed it by mistake.
                </span>

                }}>Clear</button>

            {addiction.porn && (
              <TextArea value={addiction.pornWhy} onChange={(v) => setA({ pornWhy: v })}

                marginTop: 12, padding: "10px 12px", borderRadius: 10, background: "rgba(227,179,65,0.08)",

/* ============================== SETTINGS ============================== */

const IDLE_OPTIONS = [
  { v: 1, label: "1 min" }, { v: 3, label: "3 min" },
  { v: 5, label: "5 min" }, { v: 15, label: "15 min" }, { v: 0, label: "Never" },
];

function Settings({ settings, setSettings, security, setSecurity, reload }) {
  const [local, setLocal] = useState(settings || { name: "", lat: "", lng: "", tz: "" });
  const [notifStatus, setNotifStatus] = useState(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
  const [pinMode, setPinMode] = useState(false);
  const [saved, setSaved] = useState(false);
  const [busy, setBusy] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const fileRef = useRef(null);

  const save = () => {
    setSettings({
      name: local.name,
      lat: local.lat === "" ? null : parseFloat(local.lat),
      lng: local.lng === "" ? null : parseFloat(local.lng),
      tz: local.tz === "" ? 0 : parseFloat(local.tz),
    });
    setSaved(true);
    setTimeout(() => setSaved(false), 1800);
  };

  const askNotif = async () => {
    if (typeof Notification === "undefined") return;
    const p = await Notification.requestPermission();
    setNotifStatus(p);
  };

  const exportAll = async () => {
    setBusy("Gathering your data");
    const keys = await storeList("");
    const out = {};
    for (const k of keys) {
      const v = await storeGet(k);
      if (v !== null) out[k] = v;
    }
    const payload = { app: "The Path", version: 8, exportedAt: new Date().toISOString(), data: out };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `the-path-backup-${toKey(new Date())}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setBusy(`Saved ${Object.keys(out).length} records`);
    } catch (e) {
      setBusy("Download blocked by the browser");
    }
    setTimeout(() => setBusy(""), 2600);
  };

  const importFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy("Restoring");
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      const data = parsed.data || parsed;
      const keys = Object.keys(data);
      for (const k of keys) await storeSet(k, data[k]);
      setBusy(`Restored ${keys.length} records`);
      await reload();
    } catch (err) {
      setBusy("That file could not be read");
    }
    if (fileRef.current) fileRef.current.value = "";
    setTimeout(() => setBusy(""), 2600);
  };

  const wipe = async () => {
    setBusy("Erasing");
    const keys = await storeList("");
    for (const k of keys) await storeDelete(k);
    setConfirmReset(false);
    setBusy("Everything erased");
    await reload();
    setTimeout(() => setBusy(""), 2600);
  };

  if (pinMode) {
    return (
      <Card>
        <SectionLabel icon={KeyRound}>{security?.hash ? "Change your code" : "Set a code"}</SectionLabel>
        <PinSetup
          existingHash={security?.hash}
          onCancel={() => setPinMode(false)}
          onSave={(hash) => { setSecurity({ ...(security || {}), hash, idleMinutes: security?.idleMinutes ?? 3 }); setPinMode(false); }}
        />
      </Card>
    );
  }

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card>
        <SectionLabel icon={HomeIcon}>Your name</SectionLabel>
        <TextInput value={local.name} onChange={(v) => setLocal({ ...local, name: v })} placeholder="Umar" />
      </Card>

      <Card>
        <SectionLabel icon={Sunrise}>Location for prayer times</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <TextInput value={local.lat ?? ""} onChange={(v) => setLocal({ ...local, lat: v })} placeholder="Latitude, e.g. 9.05" inputMode="decimal" />
          <TextInput value={local.lng ?? ""} onChange={(v) => setLocal({ ...local, lng: v })} placeholder="Longitude, e.g. 7.49" inputMode="decimal" />
        </div>
        <TextInput value={local.tz ?? ""} onChange={(v) => setLocal({ ...local, tz: v })} placeholder="UTC offset, e.g. 1" inputMode="decimal" />
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, marginTop: 8, lineHeight: 1.55 }}>
          Times are calculated on device using MWL angles, accurate to within a minute or two. Look up your city's coordinates once and enter them here.
        </div>
        <button onClick={save} style={{ ...addBtn, marginTop: 12, width: "100%" }}>
          {saved ? <><Check size={14} /> Saved</> : "Save settings"}
        </button>
      </Card>

      <Card tone={security?.hash ? "sky" : "gold"}>
        <SectionLabel icon={security?.hash ? Lock : Unlock} tone={security?.hash ? "sky" : "gold"}>Privacy</SectionLabel>
        <div style={{ display: "flex", alignItems: "center", gap: 11, marginBottom: 14 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontFamily: SANS, fontSize: 13.5, color: COLORS.text }}>
              {security?.hash ? "Code is on" : "No code set"}
            </div>
            <div style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.muted, marginTop: 3, lineHeight: 1.5 }}>
              {security?.hash
                ? "You will be asked for it every time this opens."
                : "Your confessions, debt and journal are readable by anyone who opens this."}
            </div>
          </div>
          <button onClick={() => setPinMode(true)} style={security?.hash ? ghostBtn : addBtn}>
            {security?.hash ? "Change" : "Set code"}
          </button>
        </div>

        {security?.hash && (
          <>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.1, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
              Lock again after
            </div>
            <div className="no-scrollbar" style={{ display: "flex", gap: 7, overflowX: "auto", marginBottom: 12 }}>
              {IDLE_OPTIONS.map((o) => (
                <PillButton key={o.v} active={(security.idleMinutes ?? 3) === o.v}
                  onClick={() => setSecurity({ ...security, idleMinutes: o.v })}>{o.label}</PillButton>
              ))}
            </div>
            <button onClick={() => setSecurity({ ...security, hash: null })} style={{ ...ghostBtn, color: COLORS.danger, borderColor: "rgba(225,91,91,0.4)", width: "100%" }}>
              Remove code
            </button>
          </>
        )}
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, marginTop: 12, lineHeight: 1.55 }}>
          This is a screen lock, not encryption. It stops someone picking up your phone and reading. It will not stop anyone with real access to the device.
        </div>
      </Card>

      <Card>
        <SectionLabel icon={Download}>Your data</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={exportAll} style={{ ...addBtn, flex: 1 }}><Download size={14} /> Download backup</button>
          <button onClick={() => fileRef.current && fileRef.current.click()} style={{ ...ghostBtn, flex: 1 }}><Upload size={14} /> Restore</button>
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={importFile} style={{ display: "none" }} />
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, lineHeight: 1.55 }}>
          The backup is a plain JSON file with everything: prayers, trades, journal, debt, confessions. Keep it somewhere private.
        </div>
        {busy && (
          <div className="rise" style={{
            marginTop: 10, padding: "9px 12px", borderRadius: 9, background: "rgba(56,189,248,0.08)",
            border: "1px solid rgba(56,189,248,0.28)", fontFamily: SANS, fontSize: 12, color: COLORS.sky,
          }}>{busy}</div>
        )}
      </Card>

      <Card>
        <SectionLabel icon={Bell}>Notifications</SectionLabel>
        <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.text, marginBottom: 10 }}>
          Status: <span style={{ color: notifStatus === "granted" ? COLORS.success : COLORS.muted }}>{notifStatus}</span>
        </div>
        <button onClick={askNotif} style={{ ...ghostBtn, width: "100%" }}>Enable browser alerts</button>
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, marginTop: 10, lineHeight: 1.55 }}>
          This can alert you while the page is open in your browser. It cannot send true background push the way a native app can. For that, the reminder logic needs to live in an installed app or your phone's alarms.
        </div>
      </Card>

      <Card style={{ borderColor: "rgba(225,91,91,0.30)" }}>
        <SectionLabel icon={AlertTriangle}>Erase everything</SectionLabel>
        {confirmReset ? (
          <div>
            <div style={{ fontFamily: SANS, fontSize: 13, color: COLORS.text, marginBottom: 12, lineHeight: 1.55 }}>
              This deletes every record: prayers, streaks, trades, journal, debt, sadaqah. It cannot be undone. Download a backup first.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setConfirmReset(false)} style={{ ...ghostBtn, flex: 1 }}>Keep my data</button>
              <button onClick={wipe} style={{ ...addBtn, flex: 1, background: COLORS.danger, color: "#fff" }}>
                <Trash2 size={14} /> Erase it all
              </button>
            </div>
          </div>
        ) : (
          <button onClick={() => setConfirmReset(true)} style={{ ...ghostBtn, color: COLORS.danger, borderColor: "rgba(225,91,91,0.35)", width: "100%" }}>
            <Trash2 size={14} /> Start over
          </button>
        )}
      </Card>
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const [tab, setTab] = useState("home");
  const [settings, setSettingsState] = useState(null);
  const [security, setSecurityState] = useState(null);
  const [dayData, setDayDataState] = useState(null);
  const [history, setHistory] = useState({});
  const [events, setEvents] = useState([]);
  const [redirects, setRedirectsState] = useState(DEFAULT_REDIRECTS);
  const [signals, setSignals] = useState({});
  const [storedBest, setStoredBest] = useState(0);
  const [booted, setBooted] = useState(false);
  const [locked, setLocked] = useState(false);
  const [holding, setHolding] = useState(false);
  const [today] = useState(new Date());
  const todayKey = toKey(today);
  const [activeKey, setActiveKey] = useState(todayKey);

  /* ---- boot ---- */
  const bootstrap = useCallback(async () => {
    const [s, sec, d, p, h, ev, rd] = await Promise.all([
      storeGet("settings"), storeGet("security"), storeGet(`day:${todayKey}`),
      storeGet("points"), storeGet("history"), storeGet("urgeEvents"), storeGet("redirects"),
    ]);
    setSettingsState(s);
    setSecurityState(sec || { hash: null, idleMinutes: 3 });
    setDayDataState(d || {});
    setActiveKey(todayKey);
    setEvents(ev || []);
    setRedirectsState(rd && rd.length ? rd : DEFAULT_REDIRECTS);
    setStoredBest(p?.bestStreak || 0);

    let hist = h || {};
    if (!h && p?.log && Object.keys(p.log).length) {
      hist = {};
      for (const k of Object.keys(p.log)) hist[k] = { p: 0, az: 0, q: 0, f: 0, clean: p.log[k], td: 0, tt: 0 };
      storeSet("history", hist);
    }
    if (d) hist = { ...hist, [todayKey]: summarise(d) };
    setHistory(hist);

    setLocked(!!(sec && sec.hash));
    setBooted(true);
  }, [todayKey]);

  useEffect(() => { bootstrap(); }, [bootstrap]);

  /* ---- load whichever day is being edited ---- */
  useEffect(() => {
    if (!booted) return;
    let live = true;
    (async () => {
      const d = await storeGet(`day:${activeKey}`);
      if (live) setDayDataState(d || {});
    })();
    return () => { live = false; };
  }, [activeKey, booted]);

  const setSettings = (s) => { setSettingsState(s); storeSet("settings", s); };
  const setSecurity = (s) => {
    const next = { idleMinutes: 3, ...s };
    setSecurityState(next);
    storeSet("security", next);
  };
  const setRedirects = (list) => { setRedirectsState(list); storeSetDebounced("redirects", list, 400); };

  const updateDay = useCallback((patch) => {
    setDayDataState((prev) => ({ ...(prev || {}), ...patch }));
  }, []);

  /* Persist the edited day and refresh its heatmap summary. */
  useEffect(() => {
    if (!booted || !dayData) return;
    storeSetDebounced(`day:${activeKey}`, dayData, 500);
    setHistory((h) => {
      const nh = { ...h, [activeKey]: summarise(dayData) };
      storeSetDebounced("history", nh, 500);
      return nh;
    });
  }, [dayData, booted, activeKey]);

  /* Points are derived, so backfilling a past day recalculates cleanly. */
  const points = useMemo(() => computePoints(history, todayKey, storedBest), [history, todayKey, storedBest]);
  useEffect(() => {
    if (!booted) return;
    storeSetDebounced("points", { ...points, log: {} }, 900);
  }, [points, booted]);

  /* ---- urge and slip event log ---- */
  const logEvent = useCallback(({ outcome, trigger, note, seconds, used }) => {
    const ts = new Date();
    const entry = {
      id: uid(), ts: ts.toISOString(), dateKey: toKey(ts), hour: ts.getHours(), dow: ts.getDay(),
      outcome, trigger: trigger || "", note: note || "", seconds: seconds || 0, used: used || [],
    };
    setEvents((prev) => {
      const next = [entry, ...prev];
      storeSet("urgeEvents", next);
      return next;
    });
    if (outcome === "slipped" && toKey(ts) === activeKey) {
      setDayDataState((prev) => {
        const a = (prev || {}).addiction || {};
        return { ...(prev || {}), addiction: { ...a, slip: true } };
      });
    }
  }, [activeKey]);

  /* ---- signals feeding the attestation ---- */
  const refreshSignals = useCallback(async () => {
    const [trades, cfg, debt, dreams] = await Promise.all([
      storeGet("trades"), storeGet("tradeConfig"), storeGet("debt"), storeGet("dreams"),
    ]);
    const rules = cfg?.rules?.length ? cfg.rules : DEFAULT_TRADE_RULES;
    const cutoff = toKey(addDays(today, -6));
    const week = (trades || []).filter((t) => t.date >= cutoff);
    const rs = week.map(tradeR).filter((r) => r != null);
    const netR = rs.reduce((a, b) => a + b, 0);
    const scored = week.map((t) => ruleScore(t, rules)).filter((v) => v != null);
    const adherence = scored.length ? scored.reduce((a, b) => a + b, 0) / scored.length : null;

    const total = parseMoney(debt?.total);
    const paid = (debt?.payments || []).reduce((a, x) => a + parseMoney(x.amount), 0);
    const recentPay = (debt?.payments || []).some((x) => x.date >= toKey(addDays(today, -14)));
    let behind = false;
    if (total > 0 && debt?.targetDate) {
      const daysLeft = daysBetween(today, fromKey(debt.targetDate));
      behind = daysLeft <= 0 ? paid < total : (paid / total) < 1 - Math.min(1, daysLeft / 365);
    }

    const live = (dreams || []).filter((d) => !d.done && d.deadline);
    const overdue = live.filter((d) => daysBetween(today, fromKey(d.deadline)) < 0).length;
    const upcoming = live.map((d) => daysBetween(today, fromKey(d.deadline))).filter((n) => n >= 0);

    setSignals({
      netR, rsCount: rs.length, adherence,
      debtRemaining: Math.max(0, total - paid), debtBehind: behind, debtMoving: total > 0 && recentPay,
      deadlineOverdue: overdue,
      nextDeadlineDays: upcoming.length ? Math.min(...upcoming) : null,
    });
  }, [todayKey]);

  useEffect(() => { if (booted) refreshSignals(); }, [booted, tab, refreshSignals]);

  const att = useMemo(() => {
    const todaySummary = history[todayKey];
    const yKey = toKey(addDays(today, -1));
    const hijri = gregorianToHijri(today);
    const sig = {
      slipToday: todaySummary?.clean === false,
      slipYesterday: history[yKey]?.clean === false,
      milestoneToday: !!STREAK_REWARDS[points.streak],
      urgesHeldToday: events.filter((e) => e.dateKey === todayKey && e.outcome === "held").length,
      streak: points.streak,
      prayersLow: today.getHours() >= 17 && (todaySummary?.p ?? 0) < 3,
      inRamadan: hijri.month === 9,
      isJumuah: today.getDay() === 5,
      tradeDown: signals.rsCount > 0 && signals.netR < 0,
      tradeUp: signals.rsCount > 0 && signals.netR > 0,
      rulesBroken: signals.adherence != null && signals.adherence < 0.7,
      debtBehind: !!signals.debtBehind,
      debtMoving: !!signals.debtMoving,
      deadlineOverdue: signals.deadlineOverdue || 0,
      nextDeadlineDays: signals.nextDeadlineDays,
    };
    return pickAttestation(sig, today);
  }, [history, points.streak, events, signals, todayKey]);

  /* ---- auto lock ---- */
  useEffect(() => {
    if (!security?.hash || locked) return;
    const mins = security.idleMinutes ?? 3;
    if (!mins) return;
    let timer;
    const reset = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { flushWrites(); setLocked(true); setHolding(false); }, mins * 60000);
    };
    const evs = ["mousedown", "keydown", "touchstart", "scroll", "pointerdown"];
    evs.forEach((e) => window.addEventListener(e, reset, { passive: true }));
    reset();
    return () => { clearTimeout(timer); evs.forEach((e) => window.removeEventListener(e, reset)); };
  }, [security, locked]);

  useEffect(() => { window.scrollTo({ top: 0 }); }, [tab]);

  if (!booted) {
    return (
      <div style={{
        background: COLORS.bg, minHeight: "100vh", display: "flex", alignItems: "center",
        justifyContent: "center", color: COLORS.muted, fontFamily: SANS, gap: 10,
      }}>
        <GlowStyles />
        <Moon size={18} color={COLORS.sky} className="glow-icon-sky" /> Loading
      </div>
    );
  }

  if (locked && security?.hash) {
    return (
      <>
        <GlowStyles />
        <LockScreen pin={security} name={settings?.name} onUnlock={() => setLocked(false)} />
      </>
    );
  }

  const dayTabs = ["deen", "todo", "accountability"];

  return (
    <div style={{
      background: `radial-gradient(130% 60% at 50% 0%, #0A1526 0%, ${COLORS.bg} 55%)`,
      minHeight: "100vh", fontFamily: SANS, color: COLORS.text, paddingBottom: 92,
    }}>
      <GlowStyles />

      {holding && (
        <HoldScreen redirects={redirects} onClose={() => setHolding(false)}
          onLog={(payload) => logEvent(payload)} />
      )}

      <div style={{ maxWidth: 480, margin: "0 auto", padding: "18px 14px 14px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <button onClick={() => setTab("home")} className="glow-text-sky" style={{
            display: "flex", alignItems: "center", gap: 8, fontFamily: SERIF, fontSize: 18,
            color: COLORS.sky, letterSpacing: 0.5, background: "none", border: "none",
            cursor: "pointer", padding: 0,
          }}><Moon size={18} strokeWidth={2} /> The Path</button>
          <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
            {security?.hash && (
              <button onClick={() => { flushWrites(); setLocked(true); }} title="Lock now" aria-label="Lock now" style={{
                background: "none", border: `1px solid ${COLORS.border}`, borderRadius: 9,
                color: COLORS.muted, padding: "7px 9px", cursor: "pointer", display: "flex",
              }}><Lock size={13} /></button>
            )}
            <button onClick={() => setTab("settings")} style={{
              background: tab === "settings" ? "rgba(56,189,248,0.10)" : "none",
              border: `1px solid ${tab === "settings" ? "rgba(56,189,248,0.4)" : COLORS.border}`,
              borderRadius: 9, color: tab === "settings" ? COLORS.sky : COLORS.muted,
              fontFamily: SANS, fontSize: 12, padding: "7px 11px", cursor: "pointer",
              display: "flex", alignItems: "center", gap: 6,
            }}><SettingsIcon size={13} /> Settings</button>
          </div>
        </div>

        {tab !== "home" && tab !== "settings" && <AttestationLine att={att} />}

        <div key={tab} className="rise">
          {tab === "home" && <Home settings={settings} dayData={dayData} setDayData={updateDay} goTo={setTab}
            history={history} points={points} hasPin={!!security?.hash} att={att} events={events}
            onHold={() => setHolding(true)} />}
          {tab === "deen" && <Deen dayData={dayData} updateDay={updateDay} now={fromKey(activeKey)}
            activeKey={activeKey} setActiveKey={setActiveKey} history={history} />}
          {tab === "smc" && <SMCJourney />}
          {tab === "journal" && <JournalHub history={history} />}
          {tab === "todo" && <Todo dayData={dayData} updateDay={updateDay}
            activeKey={activeKey} setActiveKey={setActiveKey} history={history} />}
          {tab === "life" && <Life />}
          {tab === "accountability" && <Accountability dayData={dayData} updateDay={updateDay} points={points}
            history={history} events={events} redirects={redirects} setRedirects={setRedirects}
            onHold={() => setHolding(true)} activeKey={activeKey} setActiveKey={setActiveKey} logEvent={logEvent} />}
          {tab === "settings" && <Settings settings={settings} setSettings={setSettings}
            security={security} setSecurity={setSecurity} reload={bootstrap} />}
        </div>
      </div>

      {!holding && tab !== "settings" && (
        <button onClick={() => setHolding(true)} aria-label="Hold, I am feeling the urge" title="Hold" style={{
          position: "fixed", right: 16, bottom: "calc(78px + env(safe-area-inset-bottom))", zIndex: 30,
          width: 50, height: 50, borderRadius: "50%", cursor: "pointer",
          background: "linear-gradient(158deg, rgba(13,25,38,0.96), rgba(20,34,56,0.96))",
          border: `1px solid ${COLORS.skyDim}`, color: COLORS.sky,
          display: "flex", alignItems: "center", justifyContent: "center",
          boxShadow: "0 0 18px rgba(56,189,248,0.28), 0 8px 22px rgba(0,0,0,0.5)",
        }}><ShieldCheck size={21} strokeWidth={1.9} /></button>
      )}

      <div className="no-scrollbar" style={{
        position: "fixed", bottom: 0, left: 0, right: 0,
        background: "rgba(6,11,20,0.88)", backdropFilter: "blur(14px)", WebkitBackdropFilter: "blur(14px)",
        borderTop: `1px solid ${COLORS.border}`, display: "flex", justifyContent: "space-around",
        padding: "7px 2px calc(7px + env(safe-area-inset-bottom))", overflowX: "auto",
        boxShadow: "0 -8px 28px rgba(0,0,0,0.5)", zIndex: 20,
      }}>
        {TABS.map((t) => {
          const on = tab === t.id;
          const backfilling = activeKey !== todayKey && dayTabs.includes(t.id);
          return (
            <button key={t.id} onClick={() => setTab(t.id)} aria-current={on ? "page" : undefined} style={{
              background: on ? "rgba(56,189,248,0.10)" : "none", border: "none", borderRadius: 11,
              display: "flex", flexDirection: "column", alignItems: "center", gap: 3, position: "relative",
              color: on ? COLORS.sky : COLORS.muted, fontFamily: SANS, fontSize: 9,
              cursor: "pointer", padding: "6px 3px", flex: "1 0 auto", minWidth: 50,
            }}>
              <t.Icon size={18} strokeWidth={on ? 2.4 : 1.8} className={on ? "glow-icon-sky" : ""} />
              {t.label}
              {backfilling && <span style={{
                position: "absolute", top: 4, right: 8, width: 5, height: 5, borderRadius: "50%",
                background: COLORS.gold, boxShadow: `0 0 6px ${COLORS.gold}`,
              }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
