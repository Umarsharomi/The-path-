<script>
(function () {
  const PREFIX = "thepath:";
  function k(key, shared) { return PREFIX + (shared ? "shared:" : "priv:") + key; }
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(k(key, shared));
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(k(key, shared), value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      const existed = localStorage.getItem(k(key, shared)) !== null;
      localStorage.removeItem(k(key, shared));
      return { key, deleted: existed, shared: !!shared };
    },
    async list(prefix, shared) {
      const p = k(prefix || "", shared);
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const full = localStorage.key(i);
        if (full && full.startsWith(p)) keys.push(full.slice(k("", shared).length));
      }
      return { keys, prefix: prefix || undefined, shared: !!shared };
    },
  };
})();
</script>

/* ============================== DATE HELPERS ============================== */

function toKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fromKey(k) {
  const [y, m, d] = k.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) {
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() + n);
  return c;
}
function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
function dayOfYear(d) {
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function shortDate(d) {
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const HIJRI_MONTHS = [
  "Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani", "Jumada al-Awwal",
  "Jumada al-Thani", "Rajab", "Sha'ban", "Ramadan", "Shawwal",
  "Dhu al-Qi'dah", "Dhu al-Hijjah",
];

/* Tabular (arithmetic) Hijri conversion. Approximate, within a day of moonsighting. */
function gregorianToHijri(date) {
  const day = date.getDate();
  const month = date.getMonth() + 1;
  const year = date.getFullYear();
  let jd =
    Math.floor((1461 * (year + 4800 + Math.floor((month - 14) / 12))) / 4) +
    Math.floor((367 * (month - 2 - 12 * Math.floor((month - 14) / 12))) / 12) -
    Math.floor((3 * Math.floor((year + 4900 + Math.floor((month - 14) / 12)) / 100)) / 4) +
    day - 32075;
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l - 1) / 10631);
  l = l - 10631 * n + 354;
  const j =
    Math.floor((10985 - l) / 5316) * Math.floor((50 * l) / 17719) +
    Math.floor(l / 5670) * Math.floor((43 * l) / 15238);
  l =
    l -
    Math.floor((30 - j) / 15) * Math.floor((17719 * j) / 50) -
    Math.floor(j / 16) * Math.floor((15238 * j) / 43) +
    29;
  const hMonth = Math.floor((24 * l) / 709);
  const hDay = l - Math.floor((709 * hMonth) / 24);
  const hYear = 30 * n + j - 30;
  return { day: hDay, month: hMonth, year: hYear };
}

function isFastDay(hijri) {
  if ([13, 14, 15].includes(hijri.day)) return "Ayyam al-Bid";
  if (hijri.month === 9) return "Ramadan";
  return null;
}
function isFastWeekday(date) {
  const dow = date.getDay();
  if (dow === 1) return "Monday sunnah";
  if (dow === 4) return "Thursday sunnah";
  return null;
}
function fastReasonsFor(date) {
  return [isFastDay(gregorianToHijri(date)), isFastWeekday(date)].filter(Boolean);
}

/* Next N sunnah fast days, scanning forward. */
function upcomingFasts(from, count = 4) {
  const out = [];
  for (let i = 1; i <= 70 && out.length < count; i++) {
    const d = addDays(from, i);
    const reasons = fastReasonsFor(d);
    if (reasons.length) out.push({ date: d, reasons, inDays: i });
  }
  return out;
}

/* Walk forward until 1 Ramadan. Cheap enough at one arithmetic call per day. */
function nextRamadan(from) {
  for (let i = 0; i <= 420; i++) {
    const d = addDays(from, i);
    const h = gregorianToHijri(d);
    if (h.month === 9 && h.day === 1) return { date: d, inDays: i, year: h.year };
  }
  return null;
}

/* ---- Prayer time calculation (MWL angles, Shafi'i Asr) ---- */
function julianDay(date) {
  let y = date.getUTCFullYear(), m = date.getUTCMonth() + 1, d = date.getUTCDate();
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100);
  const B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function fixHour(h) { h = h - 24 * Math.floor(h / 24); return h < 0 ? h + 24 : h; }
function fixAngle(a) { return a - 360 * Math.floor(a / 360); }

function prayerTimesForDay(date, lat, lng, tzOffset) {
  const jDate = julianDay(new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())));
  const D = jDate - 2451545.0;
  const g = fixAngle(357.529 + 0.98560028 * D) * (Math.PI / 180);
  const q = fixAngle(280.459 + 0.98564736 * D);
  const L = fixAngle(q + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * (Math.PI / 180);
  const e = (23.439 - 0.00000036 * D) * (Math.PI / 180);
  const RA = (Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)) * 180) / Math.PI / 15;
  const decl = Math.asin(Math.sin(e) * Math.sin(L));
  const eqT = q / 15 - fixHour(RA);

  const noon = 12 - lng / 15 - eqT + tzOffset;
  const angleTime = (angle, isRise) => {
    const latR = (lat * Math.PI) / 180;
    const angR = (angle * Math.PI) / 180;
    const cosH = (-Math.sin(angR) - Math.sin(latR) * Math.sin(decl)) / (Math.cos(latR) * Math.cos(decl));
    if (cosH > 1 || cosH < -1) return null;
    const H = (Math.acos(cosH) * 180) / Math.PI / 15;
    return noon + (isRise ? -H : H);
  };
  const asr = (() => {
    const latR = (lat * Math.PI) / 180;
    const a = Math.atan(1 / (1 + Math.tan(Math.abs(latR - decl))));
    return angleTime(-((a * 180) / Math.PI), false);
  })();

  return {
    fajr: angleTime(18, true),
    sunrise: angleTime(0.833, true),
    dhuhr: noon,
    asr,
    maghrib: angleTime(0.833, false),
    isha: angleTime(17, false),
  };
}
function fmtClock(h) {
  if (h === null || h === undefined || isNaN(h)) return "\u2014";
  h = fixHour(h);
  let hh = Math.floor(h);
  let mm = Math.round((h - hh) * 60);
  if (mm === 60) { mm = 0; hh += 1; }
  hh = Math.floor(fixHour(hh));
  const ampm = hh >= 12 ? "PM" : "AM";
  let h12 = hh % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(mm).padStart(2, "0")} ${ampm}`;
}
/* Which prayer is next, and how long until it. */
function nextPrayerFrom(times, now) {
  if (!times) return null;
  const cur = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
  for (const k of PRAYER_KEYS) {
    const t = times[k];
    if (t != null && !isNaN(t) && t > cur) {
      const mins = Math.round((t - cur) * 60);
      return { key: k, label: PRAYER_LABELS[k], at: t, mins };
    }
  }
  const t = times.fajr;
  if (t == null || isNaN(t)) return null;
  const mins = Math.round((t + 24 - cur) * 60);
  return { key: "fajr", label: "Fajr", at: t, mins, tomorrow: true };
}
function fmtCountdown(mins) {
  if (mins < 0) return "now";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h === 0) return `${m} min`;
  return `${h}h ${m}m`;
}

/* ============================== MONEY ============================== */

function parseMoney(v) {
  if (v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
}
function fmtNaira(n, compact = false) {
  const v = Math.round(Number(n) || 0);
  if (compact && Math.abs(v) >= 1000000) return `\u20A6${(v / 1000000).toFixed(v % 1000000 === 0 ? 0 : 1)}M`;
  if (compact && Math.abs(v) >= 1000) return `\u20A6${(v / 1000).toFixed(0)}k`;
  return `\u20A6${v.toLocaleString()}`;
}

/* ============================== PIN ============================== */
/* A screen lock, not encryption. It stops casual eyes, nothing more. */
function hashPin(pin) {
  const salted = `path-v8:${pin}:crescent`;
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < salted.length; i++) {
    const c = salted.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul((h2 + c) ^ (h2 >>> 7), 0x85ebca6b) >>> 0;
  }
  return `${h1.toString(36)}.${h2.toString(36)}`;
}

/* ============================== TRADE MATH ============================== */

function parseR(text) {
  if (!text) return null;
  const m = String(text).match(/(-?\d+(?:\.\d+)?)\s*R/i);
  if (m) return parseFloat(m[1]);
  const n = String(text).match(/^\s*([+-]?\d+(?:\.\d+)?)\s*$/);
  return n ? parseFloat(n[1]) : null;
}
/* Older entries only had free-text outcome. Read a status out of it. */
function inferStatus(t) {
  if (t.status) return t.status;
  const r = t.r != null ? t.r : parseR(t.outcome);
  if (r != null) return r > 0 ? "Win" : r < 0 ? "Loss" : "Breakeven";
  const s = String(t.outcome || "").toLowerCase();
  if (/\bwin|won|tp|profit/.test(s)) return "Win";
  if (/\bloss|lost|sl\b|stopped/.test(s)) return "Loss";
  if (/\bbe\b|break ?even/.test(s)) return "Breakeven";
  return null;
}
function tradeR(t) {
  if (t.r != null && t.r !== "") {
    const n = parseFloat(t.r);
    return isNaN(n) ? null : n;
  }
  return parseR(t.outcome);
}

  prayersLow: "Because salah is behind today",
  ramadan: "Because it is Ramadan",
  jumuah: "Because it is Jumu'ah",
  tradeDown: "Because the trading week is red",
  tradeUp: "Because the trading week is green",
  rulesBroken: "Because your rules slipped this week",
  debtBehind: "Because the debt is behind pace",
  debtMoving: "Because the debt is moving",
  deadlineNear: "Because a deadline is close",
  deadlineOverdue: "Because a deadline passed",
  general: "",
};

/* Highest priority match wins. Returns the line plus why it was chosen. */
function pickAttestation(sig, date) {
  const order = [];
  if (sig.slipToday) order.push("slipToday");
  if (sig.slipYesterday && !sig.slipToday) order.push("slipYesterday");
  if (sig.milestoneToday) order.push("milestone");
  if (sig.urgesHeldToday > 0 && !sig.slipToday) order.push("urgeHeld");
  if (sig.deadlineOverdue > 0) order.push("deadlineOverdue");
  if (sig.rulesBroken) order.push("rulesBroken");
  if (sig.prayersLow) order.push("prayersLow");
  if (sig.inRamadan) order.push("ramadan");
  if (sig.tradeDown) order.push("tradeDown");
  if (sig.debtBehind) order.push("debtBehind");
  if (sig.streak > 0 && sig.streak <= 4 && !sig.slipToday) order.push("rebuilding");
  if (sig.nextDeadlineDays != null && sig.nextDeadlineDays <= 30) order.push("deadlineNear");
  if (sig.isJumuah) order.push("jumuah");
  if (sig.streak >= 14) order.push("streakStrong");
  if (sig.tradeUp) order.push("tradeUp");
  if (sig.debtMoving) order.push("debtMoving");
  order.push("general");

  const key = order[0];
  const bank = ATTESTATION_BANK[key] || ATTESTATION_BANK.general;
  /* Seed on the date alone. Adding the streak made the seed advance by two
     each day, which locked even-length banks to half their lines. */
  const spin = dayOfYear(date);
  return { text: bank[spin % bank.length], tone: ATTESTATION_TONE[key] || "violet", why: ATTESTATION_WHY[key] || "", key };
}

/* ============================== POINTS ==============================
Derived from history rather than accumulated, so backfilling a past day
recalculates the streak correctly instead of drifting.
============================================================================= */

const STREAK_REWARDS = { 7: 20, 30: 100, 90: 250, 180: 500, 365: 1000 };

function computePoints(history, todayKey, storedBest = 0) {
  const keys = Object.keys(history || {})
    .filter((k) => history[k] && history[k].clean != null)
    .sort();
  let total = 0, best = 0, run = 0, prev = null;
  for (const k of keys) {
    if (prev && daysBetween(fromKey(prev), fromKey(k)) > 1) run = 0;
    if (history[k].clean === true) {
      total += 5;
      run += 1;
      if (STREAK_REWARDS[run]) total += STREAK_REWARDS[run];
      if (run > best) best = run;
    } else run = 0;
    prev = k;
  }
  let streak = 0;
  let cursor = fromKey(todayKey);
  const todayLogged = history?.[todayKey] && history[todayKey].clean != null;
  if (!todayLogged) cursor = addDays(cursor, -1);
  for (let i = 0; i < 4000; i++) {
    const k = toKey(cursor);
    if (history?.[k]?.clean === true) { streak += 1; cursor = addDays(cursor, -1); }
    else break;
  }
  return { total, streak, bestStreak: Math.max(best, storedBest || 0) };
}

async function storeGet(key) {
  try {
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : null;
  } catch (e) { return null; }
}
async function storeSet(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch (e) { return false; }
}

/* Text fields fire on every keystroke. Coalesce writes so a long journal
   entry is one save, not three hundred, and flush on the way out. */
const pendingWrites = new Map();
function storeSetDebounced(key, value, delay = 700) {
  const prev = pendingWrites.get(key);
  if (prev) clearTimeout(prev.timer);
  const timer = setTimeout(() => { pendingWrites.delete(key); storeSet(key, value); }, delay);
  pendingWrites.set(key, { timer, value });
}
function flushWrites() {
  pendingWrites.forEach((entry, key) => { clearTimeout(entry.timer); storeSet(key, entry.value); });
  pendingWrites.clear();
}
if (typeof window !== "undefined" && !window.__pathFlushBound) {
  window.__pathFlushBound = true;
  window.addEventListener("visibilitychange", () => { if (document.hidden) flushWrites(); });
  window.addEventListener("pagehide", flushWrites);
}
async function storeList(prefix = "") {
  try {
    const r = await window.storage.list(prefix, false);
    return r && r.keys ? r.keys : [];
  } catch (e) { return []; }
}
async function storeDelete(key) {
  try { await window.storage.delete(key, false); return true; } catch (e) { return false; }
}

/* ---- Signature: the Crescent. Five arcs, one per pillar of the day. ---- */
function CrescentRing({ segments, size = 150 }) {
  const done = segments.filter((s) => s.done).length;
  const progress = segments.length ? done / segments.length : 0;
  const r = size / 2 - 12;
  const cx = size / 2, cy = size / 2;
  const gap = 5;
  const per = 360 / segments.length;

  const arc = (startDeg, endDeg) => {
    const rad = (d) => ((d - 90) * Math.PI) / 180;
    const x1 = cx + r * Math.cos(rad(startDeg)), y1 = cy + r * Math.sin(rad(startDeg));
    const x2 = cx + r * Math.cos(rad(endDeg)), y2 = cy + r * Math.sin(rad(endDeg));
    const large = endDeg - startDeg > 180 ? 1 : 0;
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
  };

  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <div className="glow-halo" style={{
        position: "absolute", inset: -10, borderRadius: "50%",
        background: `radial-gradient(circle, rgba(167,139,250,${0.10 + progress * 0.28}) 0%, transparent 68%)`,
        filter: "blur(9px)",
      }} />
      <svg width={size} height={size} style={{ position: "relative", display: "block" }}>
        {segments.map((s, i) => {
          const start = i * per + gap / 2;
          const end = (i + 1) * per - gap / 2;
          return (
            <g key={s.key}>
              <path d={arc(start, end)} fill="none" stroke="rgba(28,48,73,0.9)" strokeWidth={9} strokeLinecap="round" />
              <path
                d={arc(start, end)} fill="none"
                stroke={s.done ? COLORS.sky : "transparent"} strokeWidth={9} strokeLinecap="round"
                className={s.done ? "glow-arc" : ""}
                style={{
                  filter: s.done ? "drop-shadow(0 0 7px rgba(56,189,248,0.85))" : "none",
                  transition: "stroke 0.45s ease",
                }} />
            </g>
          );
        })}
      </svg>
      <div style={{
        position: "absolute", inset: 0, display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", gap: 1,
      }}>
        <Moon size={15} color={COLORS.teal} strokeWidth={2}
          style={{ filter: `drop-shadow(0 0 6px rgba(167,139,250,${0.35 + progress * 0.5}))` }} />
        <div className="glow-text-sky tnum" style={{ fontFamily: SERIF, fontSize: 29, color: COLORS.sky, lineHeight: 1.1 }}>
          {Math.round(progress * 100)}%
        </div>
        <div className="tnum" style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.muted, letterSpacing: 1.4 }}>
          {done} OF {segments.length} TODAY
        </div>
      </div>
    </div>
  );
}

/* ---- Cumulative-R equity curve. Hand drawn so it matches the palette. ---- */
function Sparkline({ points, height = 72 }) {
  if (!points || points.length < 2) return null;
  const w = 300;
  const min = Math.min(...points, 0);
  const max = Math.max(...points, 0);
  const span = max - min || 1;
  const x = (i) => (i / (points.length - 1)) * w;
  const y = (v) => height - 6 - ((v - min) / span) * (height - 12);
  const d = points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(p).toFixed(1)}`).join(" ");
  const area = `${d} L ${w} ${height} L 0 ${height} Z`;
  const last = points[points.length - 1];
  const up = last >= 0;
  const stroke = up ? COLORS.success : COLORS.danger;
  const zeroY = y(0);
  return (
    <svg viewBox={`0 0 ${w} ${height}`} width="100%" height={height} preserveAspectRatio="none" style={{ display: "block" }}>
      <defs>
        <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={stroke} stopOpacity="0.28" />
          <stop offset="100%" stopColor={stroke} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#sparkFill)" />
      {zeroY > 0 && zeroY < height && (
        <line x1="0" y1={zeroY} x2={w} y2={zeroY} stroke={COLORS.border} strokeWidth="1" strokeDasharray="3 4" />
      )}
      <path d={d} fill="none" stroke={stroke} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"
        style={{ filter: `drop-shadow(0 0 5px ${stroke}88)` }} vectorEffect="non-scaling-stroke" />
    </svg>
  );
}

function LockScreen({ pin, onUnlock, name }) {
  const [entry, setEntry] = useState("");
  const [error, setError] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [cooldown, setCooldown] = useState(0);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setInterval(() => setCooldown((c) => Math.max(0, c - 1)), 1000);
    return () => clearInterval(t);
  }, [cooldown]);

  const submit = useCallback((code) => {
    if (hashPin(code) === pin.hash) { onUnlock(); return; }
    setError(true);
    const next = attempts + 1;
    setAttempts(next);
    if (next % 5 === 0) setCooldown(30);
    setTimeout(() => { setEntry(""); setError(false); }, 480);
  }, [pin, onUnlock, attempts]);

  const push = (d) => {
    if (cooldown > 0 || error) return;
    const next = entry + d;
    if (next.length > 4) return;
    setEntry(next);
    if (next.length === 4) setTimeout(() => submit(next), 130);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (cooldown > 0) return;
      if (/^[0-9]$/.test(e.key)) push(e.key);
      else if (e.key === "Backspace") setEntry((s) => s.slice(0, -1));
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });

  return (
    <div style={{
      position: "fixed", inset: 0, zIndex: 100,
      background: `radial-gradient(120% 80% at 50% -10%, #0B1830 0%, ${COLORS.ink} 62%)`,
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      padding: "28px 20px calc(28px + env(safe-area-inset-bottom))", gap: 22,
    }}>
      <div className="rise" style={{ textAlign: "center" }}>
        <div className="glow-halo" style={{
          width: 62, height: 62, borderRadius: "50%", margin: "0 auto 14px",
          display: "flex", alignItems: "center", justifyContent: "center",
          background: "radial-gradient(circle, rgba(56,189,248,0.16), transparent 70%)",
          border: `1px solid rgba(56,189,248,0.30)`,
        }}>
          <Moon size={26} color={COLORS.sky} strokeWidth={1.8} style={{ filter: "drop-shadow(0 0 10px rgba(56,189,248,0.7))" }} />
        </div>
        <div style={{ fontFamily: SERIF, fontSize: 25, color: COLORS.text, letterSpacing: 0.3 }}>
          {name ? `Welcome back, ${name}.` : "The Path"}
        </div>
        <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.muted, marginTop: 6 }}>
          {cooldown > 0
            ? `Too many tries. Wait ${cooldown}s.`
            : error ? "Wrong code. Try again."
            : "Enter your 4 digit code"}
        </div>
      </div>

      <PinDots count={entry.length} error={error} />

      <Keypad onDigit={push} onBackspace={() => setEntry((s) => s.slice(0, -1))} disabled={cooldown > 0} />

      <div style={{
        fontFamily: SANS, fontSize: 11, color: COLORS.faint, textAlign: "center",
        maxWidth: 280, lineHeight: 1.5,
      }}>
        This is a screen lock, not encryption. It keeps casual eyes out of your journal.
      </div>
    </div>
  );
}

/* Used in Settings to create or change the code. */
function PinSetup({ existingHash, onSave, onCancel }) {
  const [step, setStep] = useState(existingHash ? "verify" : "new");
  const [entry, setEntry] = useState("");
  const [first, setFirst] = useState("");
  const [error, setError] = useState("");

  const titles = {
    verify: "Enter your current code",
    new: "Choose a 4 digit code",
    confirm: "Enter it once more",
  };

  const handle = (code) => {
    if (step === "verify") {
      if (hashPin(code) === existingHash) { setStep("new"); setError(""); }
      else setError("That code does not match.");
    } else if (step === "new") {
      setFirst(code); setStep("confirm"); setError("");
    } else {
      if (code === first) { onSave(hashPin(code)); return; }
      setError("Those did not match. Start again.");
      setStep("new"); setFirst("");
    }
    setTimeout(() => setEntry(""), 200);
  };

  const push = (d) => {
    const next = entry + d;
    if (next.length > 4) return;
    setEntry(next);
    if (next.length === 4) setTimeout(() => handle(next), 130);
  };

  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ fontFamily: SANS, fontSize: 13.5, color: COLORS.text, marginBottom: 14 }}>{titles[step]}</div>
      <div style={{ marginBottom: 18 }}><PinDots count={entry.length} error={!!error} /></div>
      <Keypad onDigit={push} onBackspace={() => setEntry((s) => s.slice(0, -1))} />
      {error && <div style={{ fontFamily: SANS, fontSize: 12, color: COLORS.danger, marginTop: 12 }}>{error}</div>}
      <button onClick={onCancel} style={{ ...ghostBtn, marginTop: 16 }}>Cancel</button>
    </div>
  );
}

/* ---- Day summary shape used by the heatmap and the weekly review ---- */
function summarise(d) {
  const prayers = d?.prayers || {};
  const todos = d?.todos || [];
  return {
    p: PRAYER_KEYS.filter((k) => prayers[k]).length,
    az: (d?.azkarAM ? 1 : 0) + (d?.azkarPM ? 1 : 0),
    q: d?.quran ? 1 : 0,
    f: d?.fast ? 1 : 0,
    clean: d?.addiction ? (!d.addiction.mast && !d.addiction.porn && !d.addiction.slip) : null,
    td: todos.filter((t) => t.done).length,
    tt: todos.length,
  };
}
function dayScore(s) {
  if (!s) return 0;
  const cleanPart = s.clean === false ? 0 : s.clean === true ? 1 : 0.5;
  return Math.min(1, (s.p / 5) * 0.5 + (s.az / 2) * 0.14 + s.q * 0.14 + cleanPart * 0.22);
}

/* ---------- RISK FLAG ---------- */
/* Silent until there is enough history to say something honest. */
function riskRead(events, now) {
  const list = (events || []).filter((e) => e.hour != null);
  if (list.length < 5) return null;
  const byDow = Array(7).fill(0), byBucket = Array(6).fill(0);
  list.forEach((e) => { byDow[e.dow] += 1; byBucket[bucketOf(e.hour)] += 1; });
  const topDow = byDow.indexOf(Math.max(...byDow));
  const topBucket = byBucket.indexOf(Math.max(...byBucket));
  const dowShare = byDow[topDow] / list.length;
  const bucketShare = byBucket[topBucket] / list.length;
  const nowDow = now.getDay(), nowBucket = bucketOf(now.getHours());
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const hits = [];
  if (nowDow === topDow && dowShare >= 0.3) hits.push(`${dayNames[topDow]}s`);
  if (nowBucket === topBucket && bucketShare >= 0.3) hits.push(`the ${HOUR_BUCKETS[topBucket].label} window`);
  if (!hits.length) return null;
  return {
    text: `${hits.join(" and ")} account for most of your logged urges. Plan the next few hours.`,
    count: list.length,
  };
}

function RiskFlag({ events, now, onHold }) {
  const read = riskRead(events, now);
  if (!read) return null;
  return (

}

/* ---------- WEEKLY REVIEW ---------- */
function WeeklyReview({ history, now, points }) {
  const [open, setOpen] = useState(false);
  const [extra, setExtra] = useState({ trades: [], journal: [], sadaqah: [] });

  useEffect(() => {
    (async () => {
      const [t, j, s] = await Promise.all([storeGet("trades"), storeGet("lifeJournal"), storeGet("sadaqah")]);
      setExtra({ trades: t || [], journal: j || [], sadaqah: s || [] });
    })();
  }, []);

  const dow = now.getDay();
  const isReviewDay = dow === 5 || dow === 0;
  useEffect(() => { if (isReviewDay) setOpen(true); }, [isReviewDay]);

  const stats = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) days.push(toKey(addDays(now, -i)));
    const rows = days.map((k) => ({ k, s: history[k] || null }));
    const prayers = rows.reduce((a, r) => a + (r.s?.p || 0), 0);
    const cleanDays = rows.filter((r) => r.s?.clean === true).length;
    const loggedDays = rows.filter((r) => r.s?.clean != null).length;
    const quranDays = rows.filter((r) => r.s?.q).length;
    const fastDays = rows.filter((r) => r.s?.f).length;
    const adhkar = rows.reduce((a, r) => a + (r.s?.az || 0), 0);

    const cutoff = toKey(addDays(now, -6));
    const weekTrades = extra.trades.filter((t) => t.date >= cutoff);
    const rs = weekTrades.map(tradeR).filter((r) => r != null);
    const netR = rs.reduce((a, b) => a + b, 0);
    const weekJournal = extra.journal.filter((e) => e.date >= cutoff).length;
    const weekSadaqah = extra.sadaqah.filter((e) => e.date >= cutoff).reduce((a, e) => a + parseMoney(e.amount), 0);

    return { rows, prayers, cleanDays, loggedDays, quranDays, fastDays, adhkar, weekTrades: weekTrades.length, netR, rs, weekJournal, weekSadaqah };
  }, [history, extra, toKey(now)]);

  const verdict = (() => {
    const p = stats.prayers / 35;
    if (p >= 0.94 && stats.cleanDays >= 6) return { text: "A strong week. Keep the same shape next week.", tone: COLORS.success };
    if (p >= 0.7) return { text: "Mostly held. The gaps are where the work is.", tone: COLORS.sky };
    if (stats.loggedDays === 0 && stats.prayers === 0) return { text: "Nothing logged yet. Start with today.", tone: COLORS.muted };
    return { text: "A hard week. It counts that you are still logging it.", tone: COLORS.gold };
  })();

  return (
    <Card tone={isReviewDay ? "gold" : undefined}>
      <SectionLabel icon={CalendarDays} tone={isReviewDay ? "gold" : "sky"} right={
        <button onClick={() => setOpen((o) => !o)} style={{
          background: "none", border: "none", color: COLORS.muted, fontFamily: SANS,
          fontSize: 11.5, cursor: "pointer", display: "flex", alignItems: "center", gap: 4,
        }}>{open ? "Hide" : "Show"}</button>
      }>
        {isReviewDay ? `${dow === 5 ? "Jumu'ah" : "Sunday"} review` : "Last 7 days"}
      </SectionLabel>

      <div style={{ display: "flex", gap: 5, marginBottom: open ? 14 : 0 }}>
        {stats.rows.map(({ k, s }) => {
          const d = fromKey(k);
          const score = dayScore(s);
          const relapse = s?.clean === false;
          return (
            <div key={k} style={{ flex: 1, textAlign: "center" }}>
              <div style={{
                height: 34, borderRadius: 8,
                background: relapse ? "rgba(225,91,91,0.22)" : `rgba(56,189,248,${0.06 + score * 0.5})`,
                border: `1px solid ${relapse ? "rgba(225,91,91,0.5)" : score > 0.05 ? `rgba(56,189,248,${0.2 + score * 0.5})` : COLORS.border}`,
                boxShadow: score > 0.6 && !relapse ? "0 0 10px rgba(56,189,248,0.28)" : "none",
              }} />
              <div style={{ fontFamily: MONO, fontSize: 8.5, color: COLORS.faint, marginTop: 4, letterSpacing: 0.5 }}>
                {"SMTWTFS"[d.getDay()]}
              </div>
            </div>
          );
        })}
      </div>

      {open && (
        <div className="rise">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 10 }}>
            <StatTile label="Prayers" value={`${stats.prayers}/35`} tone="sky" size={19}
              sub={`${Math.round((stats.prayers / 35) * 100)}% held`} />
            <StatTile label="Clean days" value={`${stats.cleanDays}/7`} tone={stats.cleanDays >= 6 ? "success" : "text"} size={19}
              sub={`${stats.loggedDays} logged`} />
            <StatTile label="Qur'an" value={`${stats.quranDays}/7`} tone="violet" size={19}
              sub={`${stats.adhkar}/14 adhkar`} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <StatTile label="Fasts" value={stats.fastDays} size={19} />
            <StatTile label="Trades" value={stats.weekTrades} size={19}
              tone={stats.netR > 0 ? "success" : stats.netR < 0 ? "danger" : "text"}
              sub={stats.rs.length ? `${stats.netR > 0 ? "+" : ""}${stats.netR.toFixed(1)}R net` : "no R logged"} />
            <StatTile label="Given" value={fmtNaira(stats.weekSadaqah, true)} tone="gold" size={19}
              sub={`${stats.weekJournal} journal`} />
          </div>
          <div style={{
            marginTop: 12, padding: "10px 12px", borderRadius: 10,
            background: "rgba(4,7,14,0.4)", border: `1px solid ${COLORS.borderSoft}`,
            fontFamily: SERIF, fontSize: 13.5, fontStyle: "italic", color: verdict.tone, lineHeight: 1.5,
          }}>
            {verdict.text}
          </div>
        </div>
      )}
    </Card>
  );
}

/* ============================== DEEN ============================== */

function Deen({ dayData, updateDay, now, activeKey, setActiveKey, history }) {
  const [sub, setSub] = useState("today");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      {sub === "today" && <DateStrip activeKey={activeKey} setActiveKey={setActiveKey} history={history} />}
      <div className="no-scrollbar" style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 2 }}>
        <PillButton active={sub === "today"} onClick={() => setSub("today")}>Today</PillButton>
        <PillButton active={sub === "quran"} onClick={() => setSub("quran")}>Qur'an</PillButton>
        <PillButton active={sub === "fasting"} onClick={() => setSub("fasting")}>Fasting</PillButton>
        <PillButton active={sub === "sadaqah"} onClick={() => setSub("sadaqah")} tone="gold">Sadaqah</PillButton>

function DeenToday({ dayData, updateDay, now }) {
  const fastReasons = fastReasonsFor(now);
  const prayers = dayData?.prayers || {};
  const setPrayer = (k, v) => updateDay({ prayers: { ...prayers, [k]: v } });
  const done = PRAYER_KEYS.filter((k) => prayers[k]).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone={done === 5 ? "sky" : undefined}>
        <SectionLabel icon={Sun} right={
          <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: done === 5 ? COLORS.success : COLORS.muted }}>{done}/5</span>
        }>Five Daily Prayers</SectionLabel>
        <div style={{ marginBottom: 10 }}><ProgressBar value={done / 5} /></div>
        {PRAYER_KEYS.map((p) => (
          <Toggle key={p} checked={!!prayers[p]} onChange={(v) => setPrayer(p, v)} label={PRAYER_LABELS[p]} />
        ))}
      </Card>

      <Card>
        <SectionLabel icon={Sparkles}>Adhkar</SectionLabel>
        <Toggle checked={!!dayData?.azkarAM} onChange={(v) => updateDay({ azkarAM: v })} label="Morning adhkar" sub="After Fajr, before sunrise" />
        <Toggle checked={!!dayData?.azkarPM} onChange={(v) => updateDay({ azkarPM: v })} label="Evening adhkar" sub="After Asr, before Maghrib" />
      </Card>

      <Card>
        <SectionLabel icon={BookOpen}>Qur'an today</SectionLabel>
        <Toggle checked={!!dayData?.quran} onChange={(v) => updateDay({ quran: v })} label="Read at least one verse" />
        <TextArea value={dayData?.quranNote || ""} onChange={(v) => updateDay({ quranNote: v })}
          placeholder="What did you read and reflect on?" rows={2} />
      </Card>

      <Card>
        <SectionLabel icon={CloudMoon}>
          Fasting {fastReasons.length > 0 ? `(${fastReasons.join(", ")})` : "(no sunnah fast today)"}
        </SectionLabel>
        <Toggle checked={!!dayData?.fast} onChange={(v) => updateDay({ fast: v })} label="Fasting today" />
      </Card>
    </div>
  );
}

/* ---------- QUR'AN PROGRESS ---------- */
const EMPTY_QURAN = { juz: {}, khatm: 0, currentSurah: 1, currentAyah: 1, memorized: {}, lastRead: "" };

function QuranProgress() {
  const [q, setQ] = useState(EMPTY_QURAN);
  const [loaded, setLoaded] = useState(false);
  const [view, setView] = useState("reading");
  const [search, setSearch] = useState("");

  useEffect(() => { (async () => { const s = await storeGet("quran"); if (s) setQ({ ...EMPTY_QURAN, ...s }); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) storeSetDebounced("quran", q); }, [q, loaded]);

  const juzDone = Object.values(q.juz).filter(Boolean).length;
  const toggleJuz = (n) => setQ({ ...q, juz: { ...q.juz, [n]: !q.juz[n] }, lastRead: toKey(new Date()) });
  const completeKhatm = () => setQ({ ...q, juz: {}, khatm: (q.khatm || 0) + 1 });

  const memorizedNums = Object.keys(q.memorized).filter((k) => q.memorized[k]).map(Number);
  const memAyat = memorizedNums.reduce((a, n) => a + (SURAHS[n - 1]?.ayat || 0), 0);
  const toggleMem = (n) => setQ({ ...q, memorized: { ...q.memorized, [n]: !q.memorized[n] } });

  const filtered = search.trim()
    ? SURAHS.filter((s) => s.name.toLowerCase().includes(search.toLowerCase()) || String(s.n) === search.trim())
    : SURAHS;

  const curSurah = SURAHS[Math.max(0, Math.min(113, (q.currentSurah || 1) - 1))];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone="violet">
        <SectionLabel icon={BookOpen} tone="violet">Where you are</SectionLabel>
        <div style={{ display: "grid", gridTemplateColumns: "1.6fr 1fr", gap: 8, marginBottom: 10 }}>
          <div>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.1, textTransform: "uppercase", color: COLORS.muted, marginBottom: 6 }}>Surah</div>
            <select value={q.currentSurah} onChange={(e) => setQ({ ...q, currentSurah: parseInt(e.target.value, 10) })}
              style={{ ...selectStyle, width: "100%" }}>
              {SURAHS.map((s) => <option key={s.n} value={s.n}>{s.n}. {s.name}</option>)}
            </select>
          </div>
          <div>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.1, textTransform: "uppercase", color: COLORS.muted, marginBottom: 6 }}>Ayah</div>
            <TextInput type="number" inputMode="numeric" value={q.currentAyah}
              onChange={(v) => setQ({ ...q, currentAyah: v })} placeholder="1" />
          </div>
        </div>
        <div style={{ marginBottom: 6 }}>
          <ProgressBar value={Math.min(1, (parseInt(q.currentAyah, 10) || 0) / (curSurah?.ayat || 1))} tone="violet" />
        </div>
        <div className="tnum" style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.muted }}>
          {curSurah?.name}, ayah {q.currentAyah || 0} of {curSurah?.ayat}
          {q.lastRead ? ` \u00B7 last marked ${q.lastRead}` : ""}
        </div>
      </Card>

      <div style={{ display: "flex", gap: 8 }}>
        <PillButton active={view === "reading"} onClick={() => setView("reading")}>Reading (juz)</PillButton>
        <PillButton active={view === "hifz"} onClick={() => setView("hifz")} tone="violet">Memorization</PillButton>
      </div>

      {view === "reading" && (
        <Card>
          <SectionLabel icon={Target} right={
            <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.sky }}>{juzDone}/30</span>
          }>Current khatm</SectionLabel>
          <div style={{ marginBottom: 12 }}><ProgressBar value={juzDone / 30} showSheen={juzDone === 30} /></div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
            {Array.from({ length: 30 }).map((_, i) => {
              const n = i + 1;
              const done = !!q.juz[n];
              return (
                <button key={n} onClick={() => toggleJuz(n)} style={{
                  aspectRatio: "1 / 1", borderRadius: 9, cursor: "pointer",
                  background: done ? "rgba(56,189,248,0.16)" : "rgba(4,7,14,0.45)",
                  border: `1px solid ${done ? COLORS.sky : COLORS.border}`,
                  color: done ? COLORS.sky : COLORS.faint,
                  fontFamily: MONO, fontSize: 12,
                  boxShadow: done ? "0 0 10px rgba(56,189,248,0.28)" : "none",
                }} className="tnum">{n}</button>
              );
            })}
          </div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginTop: 14 }}>
            <div className="tnum" style={{ fontFamily: SANS, fontSize: 12, color: COLORS.muted }}>
              Completed khatms: <span style={{ color: COLORS.gold, fontFamily: SERIF, fontSize: 16 }}>{q.khatm || 0}</span>
            </div>
            <button onClick={completeKhatm} disabled={juzDone < 30}
              style={{ ...(juzDone === 30 ? addBtn : ghostBtn), opacity: juzDone < 30 ? 0.5 : 1, cursor: juzDone < 30 ? "not-allowed" : "pointer" }}>
              <Trophy size={14} /> Finish khatm
            </button>
          </div>
        </Card>
      )}

      {view === "hifz" && (
        <Card tone="violet">
          <SectionLabel icon={Award} tone="violet" right={
            <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.teal }}>{memorizedNums.length}/114</span>
          }>Memorized</SectionLabel>
          <div style={{ marginBottom: 8 }}><ProgressBar value={memAyat / TOTAL_AYAT} tone="violet" /></div>
          <div className="tnum" style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.muted, marginBottom: 12 }}>
            {memAyat.toLocaleString()} of {TOTAL_AYAT.toLocaleString()} ayat ({((memAyat / TOTAL_AYAT) * 100).toFixed(1)}%)
          </div>
          <div style={{ position: "relative", marginBottom: 10 }}>
            <Search size={13} color={COLORS.faint} style={{ position: "absolute", left: 11, top: 13 }} />
            <TextInput value={search} onChange={setSearch} placeholder="Find a surah" style={{ paddingLeft: 32 }} />
          </div>
          <div className="scroll-thin" style={{ maxHeight: 320, overflowY: "auto", paddingRight: 4 }}>
            {filtered.map((s) => {
              const on = !!q.memorized[s.n];
              return (
                <button key={s.n} onClick={() => toggleMem(s.n)} style={{
                  display: "flex", alignItems: "center", gap: 10, width: "100%",
                  background: on ? "rgba(167,139,250,0.10)" : "transparent",
                  border: `1px solid ${on ? "rgba(167,139,250,0.5)" : COLORS.border}`,
                  borderRadius: 9, padding: "8px 11px", marginBottom: 6, cursor: "pointer",
                  color: COLORS.text, fontFamily: SANS, fontSize: 13, textAlign: "left",
                }}>
                  <span className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.faint, width: 24 }}>{s.n}</span>
                  <span style={{ flex: 1, color: on ? COLORS.text : COLORS.muted }}>{s.name}</span>
                  <span className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.faint }}>{s.ayat}</span>
                  {on && <Check size={14} color={COLORS.teal} strokeWidth={3} />}
                </button>
              );
            })}
            {filtered.length === 0 && <EmptyState icon={Search} title="No surah matches that." />}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ---------- FASTING ---------- */
function Fasting({ dayData, updateDay, now }) {
  const realToday = new Date();
  const fastReasons = fastReasonsFor(now);
  const upcoming = useMemo(() => upcomingFasts(realToday, 5), [toKey(realToday)]);
  const ram = useMemo(() => nextRamadan(realToday), [toKey(realToday)]);
  const hijri = gregorianToHijri(realToday);
  const inRamadan = hijri.month === 9;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone={fastReasons.length ? "sky" : undefined}>
        <SectionLabel icon={CloudMoon}>
          Today {fastReasons.length ? `(${fastReasons.join(", ")})` : "(no sunnah fast)"}
        </SectionLabel>
        <Toggle checked={!!dayData?.fast} onChange={(v) => updateDay({ fast: v })} label="Fasting today" />
      </Card>

      <Card tone="gold">
        <SectionLabel icon={Moon} tone="gold">Ramadan</SectionLabel>
        {inRamadan ? (
          <div>
            <div className="tnum" style={{ fontFamily: SERIF, fontSize: 30, color: COLORS.gold }}>Day {hijri.day}</div>
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.muted, marginTop: 4 }}>
              Ramadan {hijri.year} AH is here. {30 - hijri.day} days left, give or take a moonsighting.
            </div>
            <div style={{ marginTop: 10 }}><ProgressBar value={hijri.day / 30} tone="gold" /></div>
          </div>
        ) : ram ? (
          <div>
            <div className="tnum" style={{ fontFamily: SERIF, fontSize: 34, color: COLORS.gold, lineHeight: 1.1 }}>
              {ram.inDays} <span style={{ fontSize: 15, fontFamily: SANS, color: COLORS.muted }}>days</span>
            </div>
            <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.muted, marginTop: 4 }}>
              until 1 Ramadan {ram.year} AH, around {ram.date.toLocaleDateString(undefined, { weekday: "short", month: "long", day: "numeric", year: "numeric" })}.
            </div>
            <div style={{ marginTop: 10 }}><ProgressBar value={1 - Math.min(1, ram.inDays / 354)} tone="gold" /></div>
          </div>
        ) : null}
        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, marginTop: 10, lineHeight: 1.5 }}>
          Calculated arithmetically, so it can sit a day either side of the local moonsighting.
        </div>
      </Card>

      <Card>
        <SectionLabel icon={CalendarDays}>Next fasts</SectionLabel>
        {upcoming.map(({ date, reasons, inDays }) => (
          <div key={toKey(date)} style={{
            display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
            padding: "10px 12px", borderRadius: 10, marginBottom: 7,
            background: "rgba(4,7,14,0.4)", border: `1px solid ${COLORS.borderSoft}`,
          }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontFamily: SANS, fontSize: 13, color: COLORS.text }}>
                {date.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}
              </div>
              <div style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.muted, marginTop: 2 }}>{reasons.join(" + ")}</div>
            </div>
            <div className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.sky, whiteSpace: "nowrap" }}>
              {inDays === 1 ? "TOMORROW" : `IN ${inDays}D`}
            </div>
          </div>
        ))}
        {upcoming.length === 0 && <EmptyState icon={CalendarDays} title="No sunnah fasts in the next ten weeks." />}
      </Card>
    </div>
  );
}

/* ---------- SADAQAH ---------- */
function Sadaqah() {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState({ amount: "", to: "", type: "Sadaqah", note: "" });

  useEffect(() => { (async () => { const s = await storeGet("sadaqah"); if (s) setItems(s); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) storeSetDebounced("sadaqah", items); }, [items, loaded]);

  const add = () => {
    if (!parseMoney(form.amount)) return;
    setItems([{ id: uid(), date: toKey(new Date()), ...form, amount: parseMoney(form.amount) }, ...items]);
    setForm({ amount: "", to: "", type: "Sadaqah", note: "" });
  };
  const remove = (id) => setItems(items.filter((i) => i.id !== id));

  const now = new Date();
  const monthKey = toKey(now).slice(0, 7);
  const yearKey = String(now.getFullYear());
  const sum = (arr) => arr.reduce((a, i) => a + parseMoney(i.amount), 0);
  const thisMonth = sum(items.filter((i) => i.date.startsWith(monthKey)));
  const thisYear = sum(items.filter((i) => i.date.startsWith(yearKey)));
  const allTime = sum(items);
  const zakatTotal = sum(items.filter((i) => i.type === "Zakat"));

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone="gold">
        <SectionLabel icon={Gift} tone="gold">Given</SectionLabel>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <StatTile label="This month" value={fmtNaira(thisMonth, true)} tone="gold" />
          <StatTile label="This year" value={fmtNaira(thisYear, true)} tone="gold" />
          <StatTile label="All time" value={fmtNaira(allTime, true)} tone="text" />
          <StatTile label="Zakat paid" value={fmtNaira(zakatTotal, true)} tone="success" />
        </div>
        <div style={{ fontFamily: SERIF, fontSize: 13, fontStyle: "italic", color: COLORS.muted, marginTop: 12, lineHeight: 1.5 }}>
          Sadaqah does not decrease wealth. Log it here, then forget it.
        </div>
      </Card>

      <Card>
        <SectionLabel icon={Plus}>Record a gift</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <TextInput value={form.amount} onChange={(v) => setForm({ ...form, amount: v })} placeholder={"Amount in \u20A6"} inputMode="decimal" />
          <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} style={selectStyle}>
            <option>Sadaqah</option><option>Zakat</option><option>Sadaqah Jariyah</option>
          </select>
        </div>
        <TextInput value={form.to} onChange={(v) => setForm({ ...form, to: v })} placeholder="Who or where it went" />
        <div style={{ height: 8 }} />
        <TextArea value={form.note} onChange={(v) => setForm({ ...form, note: v })} placeholder="Optional note" rows={2} />
        <div style={{ height: 10 }} />
        <button onClick={add} className="glow-btn" style={{ ...addBtn, width: "100%" }}><Plus size={14} /> Save gift</button>
      </Card>

      <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
        {items.map((i) => (
          <Card key={i.id} style={{ padding: "12px 14px" }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
              <div style={{ minWidth: 0, flex: 1 }}>
                <div className="tnum" style={{ fontFamily: SERIF, fontSize: 17, color: COLORS.gold }}>{fmtNaira(i.amount)}</div>
                <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.text, marginTop: 2 }}>
                  {i.type}{i.to ? ` to ${i.to}` : ""}
                </div>
                {i.note && <div style={{ fontFamily: SANS, fontSize: 12, color: COLORS.muted, marginTop: 4 }}>{i.note}</div>}
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.faint }}>{i.date}</span>
                <IconX onClick={() => remove(i.id)} />
              </div>
            </div>
          </Card>
        ))}
        {items.length === 0 && <EmptyState icon={Gift} title="Nothing logged yet." action="Record your first gift above." />}
      </div>
    </div>
  );
}

/* ============================== SMC ============================== */

function SMCJourney() {
  const [smc, setSmc] = useState({ stage: "Learning market structure", notes: "", checklist: [] });
  const [loaded, setLoaded] = useState(false);
  const [newItem, setNewItem] = useState("");

  useEffect(() => { (async () => { const s = await storeGet("smc"); if (s) setSmc({ checklist: [], ...s }); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) storeSetDebounced("smc", smc); }, [smc, loaded]);

  const add = () => {
    if (!newItem.trim()) return;
    setSmc({ ...smc, checklist: [...smc.checklist, { id: uid(), text: newItem, done: false }] });
    setNewItem("");
  };
  const toggle = (id) => setSmc({ ...smc, checklist: smc.checklist.map((c) => c.id === id ? { ...c, done: !c.done } : c) });
  const remove = (id) => setSmc({ ...smc, checklist: smc.checklist.filter((c) => c.id !== id) });
  const done = smc.checklist.filter((c) => c.done).length;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone="sky">
        <SectionLabel icon={TrendingUp}>Currently Learning</SectionLabel>
        <TextInput value={smc.stage} onChange={(v) => setSmc({ ...smc, stage: v })} placeholder="Order blocks, liquidity sweeps, FVG" />
      </Card>
      <Card>
        <SectionLabel icon={NotebookPen}>Study Notes</SectionLabel>
        <TextArea rows={5} value={smc.notes} onChange={(v) => setSmc({ ...smc, notes: v })} placeholder="Concepts, mistakes, breakthroughs" />
      </Card>
      <Card>
        <SectionLabel icon={CheckSquare} right={
          smc.checklist.length > 0 ? <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.muted }}>{done}/{smc.checklist.length}</span> : null
        }>Mastery Checklist</SectionLabel>
        {smc.checklist.length > 0 && <div style={{ marginBottom: 12 }}><ProgressBar value={done / smc.checklist.length} /></div>}
        {smc.checklist.map((c) => (
          <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <div style={{ flex: 1, minWidth: 0 }}><Toggle checked={c.done} onChange={() => toggle(c.id)} label={c.text} /></div>
            <div style={{ marginBottom: 8 }}><IconX onClick={() => remove(c.id)} /></div>
          </div>
        ))}
        {smc.checklist.length === 0 && <EmptyState icon={Target} title="No concepts tracked yet." action="Add the first one you are working through." />}
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <TextInput value={newItem} onChange={setNewItem} placeholder="Add an SMC concept" />
          <button onClick={add} style={addBtn}><Plus size={14} /></button>
        </div>
      </Card>
    </div>
  );
}

/* ============================== TRADE STATS ============================== */

function TradeStats({ trades, history, rules }) {
  const [filter, setFilter] = useState("All");
  const pool = filter === "All" ? trades : trades.filter((t) => (t.type || "Demo") === filter);

  const rows = pool.map((t) => ({ ...t, _r: tradeR(t), _s: inferStatus(t), _rule: ruleScore(t, rules) }));
  const graded = rows.filter((r) => r._s);
  const wins = graded.filter((r) => r._s === "Win").length;
  const losses = graded.filter((r) => r._s === "Loss").length;
  const be = graded.filter((r) => r._s === "Breakeven").length;
  const decided = wins + losses;
  const winRate = decided ? (wins / decided) * 100 : null;

  const withR = rows.filter((r) => r._r != null);
  const netR = withR.reduce((a, r) => a + r._r, 0);
  const avgR = withR.length ? netR / withR.length : null;
  const grossWin = withR.filter((r) => r._r > 0).reduce((a, r) => a + r._r, 0);
  const grossLoss = Math.abs(withR.filter((r) => r._r < 0).reduce((a, r) => a + r._r, 0));
  const pf = grossLoss > 0 ? grossWin / grossLoss : null;
  const best = withR.length ? Math.max(...withR.map((r) => r._r)) : null;
  const worst = withR.length ? Math.min(...withR.map((r) => r._r)) : null;

  const curve = useMemo(() => {
    const ordered = [...withR].reverse();
    let acc = 0;
    return [0, ...ordered.map((r) => (acc += r._r))];
  }, [pool.length, filter, trades]);

  const byType = ["Demo", "Backtest", "Live"].map((tp) => {
    const set = trades.filter((t) => (t.type || "Demo") === tp).map((t) => ({ ...t, _r: tradeR(t), _s: inferStatus(t) }));
    const w = set.filter((r) => r._s === "Win").length;
    const l = set.filter((r) => r._s === "Loss").length;
    const rr = set.filter((r) => r._r != null);
    return { tp, count: set.length, wr: w + l ? (w / (w + l)) * 100 : null, net: rr.length ? rr.reduce((a, r) => a + r._r, 0) : null };
  });

  /* Rule adherence: clean sheets against everything else. */
  const scored = rows.filter((r) => r._rule != null);
  const adherence = scored.length ? (scored.reduce((a, r) => a + r._rule, 0) / scored.length) * 100 : null;
  const splitBy = (pred) => {
    const set = scored.filter(pred);
    const w = set.filter((r) => r._s === "Win").length;
    const l = set.filter((r) => r._s === "Loss").length;
    const rr = set.filter((r) => r._r != null);
    return { n: set.length, wr: w + l ? (w / (w + l)) * 100 : null, net: rr.length ? rr.reduce((a, r) => a + r._r, 0) : null };
  };
  const clean = splitBy((r) => r._rule === 1);
  const broke = splitBy((r) => r._rule < 1);

  /* Tilt: trades taken on days the accountability log recorded a slip. */
  const tiltRows = rows.filter((r) => history?.[r.date]?.clean != null);
  const onSlip = tiltRows.filter((r) => history[r.date].clean === false);
  const onClean = tiltRows.filter((r) => history[r.date].clean === true);
  const agg = (set) => {
    const w = set.filter((r) => r._s === "Win").length;
    const l = set.filter((r) => r._s === "Loss").length;
    const rr = set.filter((r) => r._r != null);
    return { n: set.length, wr: w + l ? (w / (w + l)) * 100 : null, net: rr.length ? rr.reduce((a, r) => a + r._r, 0) : null };
  };
  const tiltSlip = agg(onSlip), tiltClean = agg(onClean);
  const showTilt = tiltSlip.n >= 2 && tiltClean.n >= 2;

  if (trades.length === 0) {
    return (
      <Card>
        <SectionLabel icon={BarChart3}>Performance</SectionLabel>
        <EmptyState icon={BarChart3} title="No trades logged yet." action="Stats appear once you save your first trade." />
      </Card>
    );
  }

  const RowStat = ({ label, d, tone }) => (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 7 }}>
      <span style={{ fontFamily: SANS, fontSize: 12, color: d.n ? COLORS.text : COLORS.faint, width: 104, minWidth: 0 }}>{label}</span>
      <div style={{ flex: 1 }}><ProgressBar value={d.wr == null ? 0 : d.wr / 100} height={6} tone={tone} /></div>
      <span className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.muted, width: 96, textAlign: "right" }}>
        {d.n === 0 ? "none" : `${d.wr == null ? "\u2014" : `${d.wr.toFixed(0)}%`} \u00B7 ${d.net == null ? "\u2014" : `${d.net > 0 ? "+" : ""}${d.net.toFixed(1)}R`}`}
      </span>
    </div>
  );

  return (
    <Card tone="sky">
      <SectionLabel icon={BarChart3} right={
        <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: COLORS.muted }}>{pool.length} logged</span>
      }>Performance</SectionLabel>

      <div className="no-scrollbar" style={{ display: "flex", gap: 7, marginBottom: 14, overflowX: "auto" }}>
        {["All", "Demo", "Backtest", "Live"].map((f) => (
          <PillButton key={f} active={filter === f} onClick={() => setFilter(f)}>{f}</PillButton>
        ))}
      </div>

      {pool.length === 0 ? (
        <EmptyState icon={BarChart3} title={`No ${filter.toLowerCase()} trades yet.`} />
      ) : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 8 }}>
            <StatTile label="Win rate" value={winRate == null ? "\u2014" : `${winRate.toFixed(0)}%`}
              tone={winRate == null ? "text" : winRate >= 50 ? "success" : "danger"}
              sub={decided ? `${wins}W ${losses}L${be ? ` ${be}BE` : ""}` : "not graded"} />
            <StatTile label="Avg R" value={avgR == null ? "\u2014" : `${avgR > 0 ? "+" : ""}${avgR.toFixed(2)}`}
              tone={avgR == null ? "text" : avgR > 0 ? "success" : "danger"}
              sub={withR.length ? `${withR.length} with R` : "add R values"} />
            <StatTile label="Rule score" value={adherence == null ? "\u2014" : `${adherence.toFixed(0)}%`}
              tone={adherence == null ? "text" : adherence >= 80 ? "success" : adherence >= 60 ? "gold" : "danger"}
              sub={scored.length ? `${scored.length} checked` : "tick rules on entry"} />
          </div>

          {decided > 0 && (
            <div style={{ display: "flex", height: 7, borderRadius: 999, overflow: "hidden", marginBottom: 12, border: `1px solid ${COLORS.borderSoft}` }}>
              <div style={{ width: `${(wins / graded.length) * 100}%`, background: COLORS.success, boxShadow: `0 0 10px ${COLORS.success}88` }} />
              <div style={{ width: `${(be / graded.length) * 100}%`, background: COLORS.muted }} />
              <div style={{ width: `${(losses / graded.length) * 100}%`, background: COLORS.danger }} />
            </div>
          )}

          {curve.length > 2 && (
            <div style={{ marginBottom: 14 }}>
              <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 6 }}>
                Cumulative R {netR !== 0 ? `(${netR > 0 ? "+" : ""}${netR.toFixed(1)}R${pf == null ? "" : `, PF ${pf.toFixed(2)}`})` : ""}
              </div>
              <Sparkline points={curve} />
              <div className="tnum" style={{ display: "flex", justifyContent: "space-between", fontFamily: MONO, fontSize: 9.5, color: COLORS.faint, marginTop: 4 }}>
                <span>BEST {best > 0 ? "+" : ""}{best?.toFixed(1)}R</span>
                <span>WORST {worst?.toFixed(1)}R</span>
              </div>
            </div>
          )}

          {scored.length >= 2 && (
            <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 12, marginBottom: 4 }}>
              <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
                Followed the rules vs did not
              </div>
              <RowStat label="Clean sheet" d={clean} tone="success" />
              <RowStat label="Broke a rule" d={broke} tone="sky" />
              {clean.net != null && broke.net != null && clean.net > broke.net && (
                <div style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.gold, marginTop: 6, lineHeight: 1.5 }}>
                  Your rules are worth {(clean.net - broke.net).toFixed(1)}R so far. The edge is in the waiting, not the entry.
                </div>
              )}
            </div>
          )}

          {showTilt && (
            <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 12, marginBottom: 4 }}>
              <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
                Traded on a clean day vs a slip day
              </div>
              <RowStat label="Clean day" d={tiltClean} tone="success" />
              <RowStat label="Slip day" d={tiltSlip} tone="sky" />
              {tiltSlip.net != null && tiltClean.net != null && tiltSlip.net < tiltClean.net && (
                <div style={{ fontFamily: SANS, fontSize: 11.5, color: COLORS.gold, marginTop: 6, lineHeight: 1.5 }}>
                  You trade worse on slip days by {(tiltClean.net - tiltSlip.net).toFixed(1)}R. Same discipline, two different arenas.
                </div>
              )}
            </div>
          )}

          <div style={{ borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 12 }}>
            <div style={{ fontFamily: MONO, fontSize: 9.5, letterSpacing: 1.2, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
              Demo vs Live
            </div>
            {byType.map((b) => <RowStat key={b.tp} label={b.tp} d={{ n: b.count, wr: b.wr, net: b.net }} tone={b.wr != null && b.wr >= 50 ? "success" : "sky"} />)}
          </div>
        </>
      )}
    </Card>
  );
}

/* ============================== TRADING JOURNAL ============================== */

function TradingJournal({ history }) {
  const [trades, setTrades] = useState([]);
  const [cfg, setCfg] = useState({ rules: DEFAULT_TRADE_RULES, limits: DEFAULT_LIMITS });
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState({ pair: "", direction: "Long", reason: "", result: "", type: "Demo", status: "", r: "", rules: {} });
  const [query, setQuery] = useState("");
  const [showRules, setShowRules] = useState(false);
  const [newRule, setNewRule] = useState("");
  const [override, setOverride] = useState(false);

  useEffect(() => {
    (async () => {
      const [t, c] = await Promise.all([storeGet("trades"), storeGet("tradeConfig")]);
      if (t) setTrades(t);
      if (c) setCfg({ rules: c.rules?.length ? c.rules : DEFAULT_TRADE_RULES, limits: { ...DEFAULT_LIMITS, ...(c.limits || {}) } });
      setLoaded(true);
    })();
  }, []);
  useEffect(() => { if (loaded) storeSetDebounced("trades", trades, 300); }, [trades, loaded]);
  useEffect(() => { if (loaded) storeSetDebounced("tradeConfig", cfg); }, [cfg, loaded]);

  const todayKey = toKey(new Date());
  const todays = trades.filter((t) => t.date === todayKey && (t.type || "Demo") === "Live");
  const todayR = todays.map(tradeR).filter((r) => r != null).reduce((a, b) => a + b, 0);
  const overTrades = todays.length >= cfg.limits.maxTrades;
  const overLoss = todayR <= -Math.abs(cfg.limits.maxLossR);
  const breached = (overTrades || overLoss) && form.type === "Live";

  const addTrade = () => {
    if (!form.pair.trim()) return;
    if (breached && !override) { setOverride(true); return; }
    const r = form.r === "" ? null : parseFloat(form.r);
    setTrades([{
      id: uid(), date: todayKey, ...form,
      r: r == null || isNaN(r) ? null : r,
      status: form.status || null,
      rules: { ...form.rules },
    }, ...trades]);
    setForm({ pair: "", direction: "Long", reason: "", result: "", type: form.type, status: "", r: "", rules: {} });
    setOverride(false);
  };
  const removeTrade = (id) => setTrades(trades.filter((t) => t.id !== id));
  const toggleRule = (id) => setForm({ ...form, rules: { ...form.rules, [id]: !form.rules[id] } });

  const statusColor = (st) => st === "Win" ? COLORS.success : st === "Loss" ? COLORS.danger : st === "Breakeven" ? COLORS.muted : COLORS.faint;

  const q = query.trim().toLowerCase();
  const shown = q
    ? trades.filter((t) => [t.pair, t.reason, t.result, t.type, t.status, t.date].join(" ").toLowerCase().includes(q))
    : trades;

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <TradeStats trades={trades} history={history} rules={cfg.rules} />

      <Card tone={breached ? undefined : "sky"} style={breached ? { borderColor: "rgba(225,91,91,0.45)" } : undefined}>
        <SectionLabel icon={ShieldCheck} tone={breached ? "gold" : "sky"} right={
          <button onClick={() => setShowRules((v) => !v)} style={{
            background: "none", border: "none", color: COLORS.muted, fontFamily: SANS, fontSize: 11.5, cursor: "pointer",
          }}>{showRules ? "Done" : "Edit limits"}</button>
        }>Today on live</SectionLabel>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <StatTile label="Trades taken" value={`${todays.length}/${cfg.limits.maxTrades}`}
            tone={overTrades ? "danger" : "text"} sub={overTrades ? "limit reached" : "within limit"} />
          <StatTile label="Day P/L" value={`${todayR > 0 ? "+" : ""}${todayR.toFixed(1)}R`}
            tone={overLoss ? "danger" : todayR > 0 ? "success" : "text"}
            sub={`floor ${-Math.abs(cfg.limits.maxLossR)}R`} />
        </div>

        {breached && (
          <div style={{
            marginTop: 12, padding: "11px 13px", borderRadius: 10,
            background: "rgba(225,91,91,0.10)", border: "1px solid rgba(225,91,91,0.4)",
          }}>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 9 }}>
              <AlertTriangle size={16} color={COLORS.danger} style={{ flexShrink: 0, marginTop: 1 }} />
              <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.text, lineHeight: 1.55 }}>
                {overLoss ? "You are at your daily loss floor." : "You have hit your trade count for today."} Close the platform. The market opens again tomorrow, and your account only opens once.
              </div>
            </div>
          </div>
        )}

        {showRules && (
          <div style={{ marginTop: 14, borderTop: `1px solid ${COLORS.borderSoft}`, paddingTop: 12 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <Field label="Max live trades / day">
                <TextInput value={cfg.limits.maxTrades} inputMode="numeric"
                  onChange={(v) => setCfg({ ...cfg, limits: { ...cfg.limits, maxTrades: parseInt(v, 10) || 0 } })} />
              </Field>
              <Field label="Daily loss floor (R)">
                <TextInput value={cfg.limits.maxLossR} inputMode="decimal"
                  onChange={(v) => setCfg({ ...cfg, limits: { ...cfg.limits, maxLossR: Math.abs(parseFloat(v)) || 0 } })} />
              </Field>
            </div>
            <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.1, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
              Your rules
            </div>
            {cfg.rules.map((r) => (
              <div key={r.id} style={{
                display: "flex", alignItems: "center", gap: 8, padding: "8px 11px", marginBottom: 6,
                borderRadius: 9, background: "rgba(4,7,14,0.4)", border: `1px solid ${COLORS.borderSoft}`,
              }}>
                <span style={{ flex: 1, fontFamily: SANS, fontSize: 12.5, color: COLORS.text, minWidth: 0 }}>{r.text}</span>
                <IconX onClick={() => setCfg({ ...cfg, rules: cfg.rules.filter((x) => x.id !== r.id) })} />
              </div>
            ))}
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <TextInput value={newRule} onChange={setNewRule} placeholder="Add a rule you keep breaking" />
              <button onClick={() => {
                if (!newRule.trim()) return;
                setCfg({ ...cfg, rules: [...cfg.rules, { id: uid(), text: newRule.trim() }] });
                setNewRule("");
              }} style={addBtn}><Plus size={14} /></button>
            </div>
          </div>
        )}
      </Card>

      <Card>
        <SectionLabel icon={NotebookPen}>Log a Trade</SectionLabel>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <TextInput value={form.pair} onChange={(v) => setForm({ ...form, pair: v })} placeholder="Pair, e.g. XAUUSD" />
          <select value={form.direction} onChange={(e) => setForm({ ...form, direction: e.target.value })} style={selectStyle}>
            <option>Long</option><option>Short</option>
          </select>
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          <select value={form.type} onChange={(e) => { setForm({ ...form, type: e.target.value }); setOverride(false); }} style={{ ...selectStyle, flex: 1 }}>
            <option>Demo</option><option>Backtest</option><option>Live</option>
          </select>
          <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} style={{ ...selectStyle, flex: 1 }}>
            <option value="">Outcome</option>
            <option>Win</option><option>Loss</option><option>Breakeven</option>
          </select>
          <TextInput value={form.r} onChange={(v) => setForm({ ...form, r: v })} placeholder="R" inputMode="decimal" style={{ width: 70 }} />
        </div>

        <div style={{ fontFamily: MONO, fontSize: 10, letterSpacing: 1.1, textTransform: "uppercase", color: COLORS.muted, marginBottom: 8 }}>
          Rule check, answer before you log
        </div>
        {cfg.rules.map((r) => (
          <Toggle key={r.id} checked={!!form.rules[r.id]} onChange={() => toggleRule(r.id)} label={r.text} tone="gold" />
        ))}

        <div style={{ height: 4 }} />
        <TextArea value={form.reason} onChange={(v) => setForm({ ...form, reason: v })} placeholder="Why did you take it? Setup and confluence." rows={2} />

        <div style={{ fontFamily: SANS, fontSize: 11, color: COLORS.faint, marginTop: 8, lineHeight: 1.5 }}>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {shown.map((t) => {
          const st = inferStatus(t);
          const r = tradeR(t);
          const rs = ruleScore(t, cfg.rules);
          const slipDay = history?.[t.date]?.clean === false;
          return (
            <Card key={t.id} style={{ position: "relative", paddingRight: 34 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>

                  {t.pair} <span style={{ color: COLORS.muted, fontSize: 13 }}>{t.direction}</span>
                </span>
                <span className="tnum" style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.faint }}>{t.type} {"\u00B7"} {t.date}</span>
              </div>

                <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 7, flexWrap: "wrap" }}>
                  {st && (
                    <span style={{
                      fontFamily: MONO, fontSize: 10, letterSpacing: 0.8, textTransform: "uppercase",
                      color: statusColor(st), border: `1px solid ${statusColor(st)}55`,
                      background: `${statusColor(st)}12`, borderRadius: 999, padding: "3px 9px",
                    }}>{st}</span>

                      {r > 0 ? "+" : ""}{r}R
                    </span>
                  )}
                  {rs != null && (
                    <span className="tnum" style={{
                      fontFamily: MONO, fontSize: 9.5, letterSpacing: 0.6,
                      color: rs === 1 ? COLORS.success : COLORS.gold,
                      border: `1px solid ${rs === 1 ? COLORS.success : COLORS.gold}44`,
                      borderRadius: 999, padding: "3px 8px",
                    }}>{rs === 1 ? "CLEAN SHEET" : `RULES ${Math.round(rs * 100)}%`}</span>
                  )}
                  {slipDay && (
                    <span style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.danger, letterSpacing: 0.6 }}>SLIP DAY</span>
                  )}
                  {t.outcome && r == null && <span style={{ fontFamily: SANS, fontSize: 12, color: COLORS.muted }}>{t.outcome}</span>}
                </div>
              )}
              {t.reason && <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.text, marginTop: 8, lineHeight: 1.5 }}>Why: {t.reason}</div>}
              {t.result && <div style={{ fontFamily: SANS, fontSize: 12.5, color: COLORS.muted, marginTop: 4, lineHeight: 1.5 }}>Result: {t.result}</div>}
              <div style={{ position: "absolute", top: 12, right: 10 }}><IconX onClick={() => removeTrade(t.id)} /></div>
            </Card>
          );
        })}
        {trades.length === 0 && <EmptyState icon={NotebookPen} title="No trades logged yet." action="Log the next one you take, win or lose." />}
        {trades.length > 0 && shown.length === 0 && <EmptyState icon={Search} title="Nothing matches that search." />}
      </div>
    </div>
  );
}

const MOODS = ["Grateful", "Content", "Neutral", "Anxious", "Struggling", "Angry", "Hopeful"];

function LifeJournal() {
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [form, setForm] = useState({ mood: "Neutral", text: "" });
  const [query, setQuery] = useState("");
  const [moodFilter, setMoodFilter] = useState("");

  useEffect(() => { (async () => { const e = await storeGet("lifeJournal"); if (e) setEntries(e); setLoaded(true); })(); }, []);
  useEffect(() => { if (loaded) storeSetDebounced("lifeJournal", entries, 300); }, [entries, loaded]);

  const addEntry = () => {
    if (!form.text.trim()) return;
    setEntries([{ id: uid(), date: toKey(new Date()), ...form }, ...entries]);
    setForm({ mood: "Neutral", text: "" });
  };
  const removeEntry = (id) => setEntries(entries.filter((e) => e.id !== id));

  const q = query.trim().toLowerCase();
  const shown = entries.filter((e) => {
    if (moodFilter && e.mood !== moodFilter) return false;
    if (!q) return true;
    return `${e.text} ${e.mood} ${e.date}`.toLowerCase().includes(q);
  });

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card tone="violet" glow="violet">
        <SectionLabel icon={NotebookPen} tone="violet">New Entry</SectionLabel>
        <div className="no-scrollbar" style={{ display: "flex", gap: 7, overflowX: "auto", marginBottom: 10, paddingBottom: 2 }}>
          {MOODS.map((m) => (
            <PillButton key={m} active={form.mood === m} onClick={() => setForm({ ...form, mood: m })} tone="violet">{m}</PillButton>
          ))}
        </div>
        <TextArea value={form.text} onChange={(v) => setForm({ ...form, text: v })}
          placeholder="What is on your mind? Family, work, feelings, gratitude, a hard moment." rows={4} />
        <div style={{ height: 10 }} />
        <button onClick={addEntry} style={{ ...addBtn, background: COLORS.teal, width: "100%" }}><Plus size={14} /> Save entry</button>
      </Card>

      {entries.length > 2 && (
        <Card style={{ padding: "13px 14px" }}>
          <div style={{ position: "relative", marginBottom: 10 }}>
            <Search size={13} color={COLORS.faint} style={{ position: "absolute", left: 11, top: 13, zIndex: 1 }} />
            <TextInput value={query} onChange={setQuery} placeholder="Search everything you have written" style={{ paddingLeft: 32 }} />
          </div>
          <div className="no-scrollbar" style={{ display: "flex", gap: 7, overflowX: "auto" }}>
            <PillButton active={!moodFilter} onClick={() => setMoodFilter("")} tone="violet">All moods</PillButton>
            {MOODS.map((m) => (
              <PillButton key={m} active={moodFilter === m} onClick={() => setMoodFilter(moodFilter === m ? "" : m)} tone="violet">{m}</PillButton>
            ))}
          </div>
          {(q || moodFilter) && (
            <div className="tnum" style={{ fontFamily: MONO, fontSize: 10, color: COLORS.muted, marginTop: 10, letterSpacing: 0.8 }}>
              {shown.length} OF {entries.length} ENTRIES
            </div>
          )}
        </Card>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {shown.map((e) => (
          <Card key={e.id} style={{ position: "relative", paddingRight: 34 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: SERIF, fontSize: 15, color: COLORS.teal }}>{e.mood}</span>
              <span className="tnum" style={{ fontFamily: MONO, fontSize: 9.5, color: COLORS.faint }}>{e.date}</span>
            </div>
            <div style={{ fontFamily: SANS, fontSize: 13, color: COLORS.text, marginTop: 7, whiteSpace: "pre-wrap", lineHeight: 1.6 }}>{e.text}</div>
            <div style={{ position: "absolute", top: 12, right: 10 }}><IconX onClick={() => removeEntry(e.id)} /></div>
          </Card>
        ))}
        {entries.length === 0 && <EmptyState icon={NotebookPen} title="No entries yet." action="Write the first one above." />}
        {entries.length > 0 && shown.length === 0 && <EmptyState icon={Search} title="Nothing matches that search." />}
      </div>
    </div>
  );
}

function Todo({ dayData, updateDay, activeKey, setActiveKey, history }) {
  const [text, setText] = useState("");
  const todos = dayData?.todos || [];
  const add = () => {
    if (!text.trim()) return;
    updateDay({ todos: [...todos, { id: uid(), text, done: false }] });
    setText("");
  };
  const toggle = (id) => updateDay({ todos: todos.map((t) => t.id === id ? { ...t, done: !t.done } : t) });
  const remove = (id) => updateDay({ todos: todos.filter((t) => t.id !== id) });
  const done = todos.filter((t) => t.done).length;

  const isToday = activeKey === toKey(new Date());
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
    <DateStrip activeKey={activeKey} setActiveKey={setActiveKey} history={history} />
    <Card>
      <SectionLabel icon={CheckSquare} right={
        todos.length > 0 ? <span className="tnum" style={{ fontFamily: MONO, fontSize: 11, color: done === todos.length ? COLORS.success : COLORS.muted }}>{done}/{todos.length}</span> : null
      }>{isToday ? "Today's To-Do" : "To-Do for that day"}</SectionLabel>
      {todos.length > 0 && <div style={{ marginBottom: 12 }}><ProgressBar value={done / todos.length} tone={done === todos.length ? "success" : "sky"} /></div>}
      {todos.map((t) => (
        <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <div style={{ flex: 1, minWidth: 0 }}><Toggle checked={t.done} onChange={() => toggle(t.id)} label={t.text} /></div>
          <div style={{ marginBottom: 8 }}><IconX onClick={() => remove(t.id)} /></div>
        </div>
      ))}
      {todos.length === 0 && <EmptyState icon={CheckSquare} title="Nothing on the list yet." action="Three things is usually enough." />}
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <TextInput value={text} onChange={setText} placeholder="Study SMC, prep lesson plan, sleep by 11" />
        <button onClick={add} style={addBtn}><Plus size={14} /></button>
      </div>
    </Card>
    </div>
  );
}
